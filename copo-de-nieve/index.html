    <style>
      .dek { margin: 0; color: var(--ink-soft); font-size: 0.88rem; line-height: 1.4; }

      /* The board sits inside the card with its own padding (not full
         bleed), so .sign keeps its frame. */
      .board-stage { position: relative; padding: 0.6rem 0.7rem 0.9rem; }

      .board {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 5px;
        /* A round sets these two icon masks; every .cell reads them via
           var(), so swapping them repaints the whole grid without touching
           a single cell node. */
        --major: none;
        --odd: none;
      }

      .cell {
        aspect-ratio: 1;
        border: none;
        border-radius: 0 33% 0 0; /* same rounded top-right corner as the station family */
        background: var(--paper-well);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .cell:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

      /* The icon is the shared .station__icon--mask (shared.css); we just feed
         it the board's --major/--odd mask and set the fill via `color`. */
      .cell__icon { color: var(--ink); --station-mask: var(--major); }
      .cell--odd .cell__icon { --station-mask: var(--odd); }

      .cell--hit { animation: diff-pop 0.18s ease; }
      .cell--hit .cell__icon { color: var(--ok); }
      .cell--wrong { animation: diff-shake 0.28s ease; }
      .cell--wrong .cell__icon { color: var(--danger); }
      @keyframes diff-pop { 50% { transform: scale(1.18); } }
      @keyframes diff-shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }

      /* The start/result overlay reuses shared .start-overlay over the
         board. On the results screen (.board-stage--done) the overlay drops
         to normal flow and the board is hidden, so the card grows to fit the
         full found-stations grid and the page scrolls - instead of the grid
         being clipped inside the fixed-height board area. */
      .start-overlay { background: var(--paper-raised); }
      .board-stage--done #board { display: none; }
      /* In the result state the overlay IS the card's full-width content,
         not a small centered start panel - so drop the shared 18rem panel
         cap, zero the board-stage's own side padding, and let the overlay's
         1.3rem match sign__head, lining the reveal up under the title
         instead of sitting narrow and over-indented. */
      .board-stage--done { padding-left: 0; padding-right: 0; }
      .board-stage--done .start-overlay { position: static; padding: 1.1rem 1.3rem; }
      .board-stage--done .start-overlay__panel { max-width: none; }
      #reveal-notice { margin-bottom: 0.6rem; }
      .game-num { color: var(--ink-soft); font-weight: 700; font-size: 0.8em; }
      #leaderboard { margin-top: 1rem; text-align: left; }

      /* End-of-round grid of the stations found, same pattern as Memoria's
         reveal: shared .station tiles filled with each station's own line
         color (--badge-bg/--badge-ink, set inline by renderRevealIcons())
         and clustered by line, with a staggered pop-in. Height is
         unrestricted - the whole grid shows, and the overlay scrolls if the
         panel outgrows the board. */
      .reveal__icons {
        display: grid;
        gap: 0.35rem;
        grid-template-columns: repeat(6, 1fr);
        width: 100%;
        margin: 0.3rem 0 0.1rem;
      }
      .reveal__icons[hidden] { display: none; }
      .reveal__icon-cell--entering {
        animation: copo-reveal-icon-pop-in 0.3s ease backwards;
        animation-delay: var(--stagger-delay, 0s);
      }
      @keyframes copo-reveal-icon-pop-in {
        from { opacity: 0; transform: scale(0.7); }
        to { opacity: 1; transform: scale(1); }
      }

      .progress { margin-top: 0.7rem; }
    </style>

            if (!slug || seen[slug] || !masks[slug]) continue;
            seen[slug] = true;
            slugToIcon[slug] = ICONS.length;
            ICONS.push({ slug: slug, mask: masks[slug] });
          }
        }

        var state = { running: false, score: 0, endTime: 0, oddIndex: -1, oddCell: null, rafId: 0,
          prevMajor: -1, prevOdd: -1, prevIndex: -1, oddIconIdx: -1, found: [],
          dateKey: '', gameNumber: 0, leaderboardSubmitted: false, streak: 0, maxStreak: 0 };

        // Per-day seeded stream, so every player (and every same-day replay)
        // gets the identical sequence of deals - and thus the same difficulty
        // curve. Reseeded from the day's dateKey in start(); until then it's
        // unused. All per-round randomness routes through rng(), never
        // Math.random() directly, or the sequence would diverge per player.
        var rng = Math.random;
        var saveTimer = 0; // 1s autosave of an in-progress round, for resume on reload
        function randInt(n) { return Math.floor(rng() * n); }

        // Difficulty ramps with the score (t in [0,1]): early on the odd
        // icon is a random dissimilar one (easy); as t grows it's drawn
        // ever nearer the top of the majority's most-similar neighbour list
        // (hard), with a small window so it isn't always a fixed rank.
        // avoid(i) is true for an icon this round must not reuse (either of
        // last round's two icons, and the majority itself).
        function pickOdd(majorIdx, avoid) {
          var t = Math.min(state.score / RAMP_SCORE, 1);
          if (t > 0 && rng() < t) {
            var si = SIM_INDEX[ICONS[majorIdx].slug];
            var neigh = (si !== undefined) ? SIM_NEIGH[si] : null;
            if (neigh && neigh.length) {
              var span = neigh.length - 1;
              for (var k = 0; k < 6; k++) { // a few tries past an avoided neighbour
                var j = Math.round((1 - t) * span * 0.6) + randInt(4);
                if (j > span) j = span;
                var idx = slugToIcon[SIM_SLUGS[neigh[j]]];
                if (idx !== undefined && idx !== majorIdx && !avoid(idx)) return idx;
              }
            }
          }
          var odd; // random, distinct from the majority and both prior icons
          do { odd = randInt(ICONS.length); } while (odd === majorIdx || avoid(odd));
          return odd;
        }

        // A round = two property writes (the icons, read by every cell via
        // var()) + moving the --odd class from the old odd cell to the new.
        // Both icons and the odd-cell position differ from the previous round,
        // so nothing visibly carries over between deals.
        function nextRound() {
          var major; // fresh majority, not either of last round's icons
          do { major = randInt(ICONS.length); }
          while (major === state.prevMajor || major === state.prevOdd);

          var oddIdx = pickOdd(major, function (i) {
            return i === state.prevMajor || i === state.prevOdd;
          });
          board.style.setProperty('--major', ICONS[major].mask);
          board.style.setProperty('--odd', ICONS[oddIdx].mask);

          var idx; // fresh position for the odd card
          do { idx = randInt(COUNT); } while (idx === state.prevIndex);
          if (state.oddCell) state.oddCell.classList.remove('cell--odd');
          var cell = cells[idx];
          cell.classList.add('cell--odd');
          state.oddCell = cell;
          state.oddIndex = idx;
          state.oddIconIdx = oddIdx; // the special station on the board right now

          state.prevMajor = major;
          state.prevOdd = oddIdx;
          state.prevIndex = idx;
        }

        function onBoardClick(e) {
          if (!state.running) return;
          var cell = e.target.closest('.cell');
          if (!cell) return;
          if (+cell.dataset.i === state.oddIndex) {
            state.score++;
            scoreText.textContent = state.score;
            if (state.oddIconIdx >= 0) state.found.push(ICONS[state.oddIconIdx].slug);
            flash(cell, 'cell--hit');
            nextRound();
          } else {
            flash(cell, 'cell--wrong'); // just feedback - no time penalty
          }
        }

        // One-card feedback, cleared on its own animationend.
        function flash(cell, cls) {
          cell.classList.remove('cell--hit', 'cell--wrong');
          void cell.offsetWidth; // restart the animation if same class repeats
          cell.classList.add(cls);
          cell.addEventListener('animationend', function handler() {
            cell.classList.remove(cls);
            cell.removeEventListener('animationend', handler);
          });
        }

        // A station pictogram as a shared .station__icon span (external
        // sprite <use>, same as Memoria's own makeIcon).
        function makeIcon(slug) {
          var wrap = document.createElement('span');
          wrap.className = 'station__icon';
          var svgNS = 'http://www.w3.org/2000/svg';
          var svg = document.createElementNS(svgNS, 'svg');
          svg.setAttribute('aria-hidden', 'true');
          var use = document.createElementNS(svgNS, 'use');
          use.setAttributeNS('http://www.w3.org/1999/xlink', 'href', '/station-icons.svg#' + slug);
          use.setAttribute('href', '/station-icons.svg#' + slug);
          svg.appendChild(use);
          wrap.appendChild(svg);
          return wrap;
        }

        // The line a found station's icon belongs to, for coloring the
        // reveal grid like Memoria's. The sprite is shared, so a slug maps
        // back to the first station name using it, then to that name's line.
        function lineForSlug(slug) {
          var slugs = MetroShared.STATION_ICON_SLUGS;
          for (var name in slugs) {
            if (slugs[name] !== slug) continue;
            for (var i = 0; i < MetroShared.LINES.length; i++) {
              if (MetroShared.LINES[i].stations.indexOf(name) !== -1) return MetroShared.LINES[i];
            }
          }
          return null;
        }

        // A representative station name for an icon slug, for sorting the
        // reveal grid alphabetically within each line.
        function nameForSlug(slug) {
          var slugs = MetroShared.STATION_ICON_SLUGS;
          for (var name in slugs) { if (slugs[name] === slug) return name; }
          return slug;
        }

        // End-of-round grid of every station found, one .station tile each,
        // filled with its own line color and clustered by line, with a
        // staggered pop-in (Memoria's reveal pattern).
        function renderRevealIcons() {
          revealIcons.textContent = '';
          if (!state.found.length) { revealIcons.hidden = true; return; }
          var reduce = MetroShared.prefersReducedMotion();
          var entries = state.found.map(function (slug) {
            var line = lineForSlug(slug);
            return { slug: slug, line: line, lineIndex: line ? MetroShared.LINES.indexOf(line) : MetroShared.LINES.length, name: nameForSlug(slug) };
          });
          // Cluster by line, then alphabetical within each line.
          entries.sort(function (a, b) { return (a.lineIndex - b.lineIndex) || a.name.localeCompare(b.name, 'es'); });
          entries.forEach(function (entry, i) {
            var cell = document.createElement('span');
            cell.className = 'station reveal__icon-cell';
            if (entry.line) {
              cell.style.setProperty('--badge-bg', entry.line.color);
              cell.style.setProperty('--badge-ink', entry.line.textColor);
            }
            if (!reduce) {
              cell.classList.add('reveal__icon-cell--entering');
              cell.style.setProperty('--stagger-delay', (i * 0.03) + 's');
            }
            cell.appendChild(makeIcon(entry.slug));
            revealIcons.appendChild(cell);
          });
          revealIcons.hidden = false;
        }

        // The day's saved state is either an in-progress round
        // (status 'playing' + remainingMs, for resuming on reload) or the
        // finished result (reload shows the reveal, never resubmits). The
        // found slugs rebuild the reveal grid without replaying.
        function storageKeyFor(dateKey) { return 'copo-de-nieve:' + dateKey; }

        function persistResult() {
          try {
            localStorage.setItem(storageKeyFor(state.dateKey), JSON.stringify({
              score: state.score,
              found: state.found,
              leaderboardSubmitted: !!state.leaderboardSubmitted,
            }));
          } catch (e) { /* localStorage unavailable - just won't reload the reveal */ }
        }

        // An in-progress snapshot, written once a second while playing. On
        // reload initDay() resumes from it: the deal sequence is a pure
        // function of the day + score, so replaying nextRound() score+1 times
        // restores the exact board and RNG position (see resumeGame()).
        function persistProgress() {
          if (!state.running) return;
          try {
            localStorage.setItem(storageKeyFor(state.dateKey), JSON.stringify({
              status: 'playing',
              score: state.score,
              found: state.found,
              remainingMs: Math.max(0, Math.round(state.endTime - performance.now())),
            }));
          } catch (e) { /* no resume if storage is unavailable */ }
        }

        function startSaveTimer() {
          clearInterval(saveTimer);
          saveTimer = setInterval(persistProgress, 1000);
        }

        function loadSavedResult(dateKey) {
          try {
            var raw = localStorage.getItem(storageKeyFor(dateKey));
            if (!raw) return null;
            var parsed = JSON.parse(raw);
            if (!parsed || typeof parsed.score !== 'number' || !Array.isArray(parsed.found)) return null;
            return { score: parsed.score, found: parsed.found, leaderboardSubmitted: !!parsed.leaderboardSubmitted,
              status: parsed.status, remainingMs: parsed.remainingMs };
          } catch (e) { return null; }
        }

        // Leaderboard / streak / record - score-based, same shape as Clasificador.
        function submitScore() {
          if (state.leaderboardSubmitted) return;
          if (MetroShared.isDebugMode()) return; // never pollute the real board from date-nav
          var alias = MetroShared.getAlias();
          if (!alias) return;

          // streak is display-only, never part of orderBySpecs.
          MetroShared.submitLeaderboardScore(LEADERBOARD_COLLECTION, state.dateKey, alias, { score: state.score, streak: state.streak }, {})
            .then(function () {
              state.leaderboardSubmitted = true;
              persistResult();
              renderLeaderboard();
              // Best-effort, never rejects - can't turn a good submission into
              // a visible error. See updateHighScoreRecord()'s own comment.
              MetroShared.updateHighScoreRecord(RECORD_GAME_KEY, state.score, alias, state.dateKey, state.gameNumber);
            })
            .catch(function (err) {
              // The result is already saved locally; a failed submit is retried
              // the next time submitScore() runs (e.g. the next reload).
              console.error('[Leaderboard] submitScore() failed:', err);
            });
        }

        // Only shown when the best-ever streak is ahead of today's.
        function maxStreakLine(separator) {
          if (state.maxStreak <= state.streak) return '';
          return separator + MetroShared.formatMaxStreak(state.maxStreak);
        }

        // All-time high score (records/copo-de-nieve) - no date dimension, so
        // this only ever loads once, from initDay().
        function renderHighScoreRecord() {
          MetroShared.getHighScoreRecord(RECORD_GAME_KEY).then(function (record) {
            if (!record) { leaderboardRecord.hidden = true; return; }
            leaderboardRecord.textContent = MetroShared.formatHighScoreRecord(record);
            leaderboardRecord.hidden = false;
          });
        }

        // Guards against an earlier async response painting over a newer one -
        // see Clasificador's own renderLeaderboard() comment.
        var leaderboardRequestId = 0;

        function renderLeaderboard() {
          var dateKey = state.dateKey;
          var requestId = ++leaderboardRequestId;
          var myAliasId = MetroShared.aliasDocId(MetroShared.getAlias());

          MetroShared.getTopLeaderboardScores(LEADERBOARD_COLLECTION, dateKey, LEADERBOARD_SIZE, [['score', 'desc']], { extraFields: ['streak'], myAliasId: myAliasId })
            .then(function (entries) {
              if (!state || state.dateKey !== dateKey) return;
              if (requestId !== leaderboardRequestId) return;

              leaderboardList.innerHTML = '';
              if (entries.length === 0) {
                leaderboardStatus.textContent = 'Todavía no hay puntajes hoy. ¡Sé el primero!';
                leaderboardStatus.hidden = false;
                return;
              }
              leaderboardStatus.hidden = true;

              entries.forEach(function (entry, index) {
                var li = document.createElement('li');
                li.className = 'leaderboard__row' + (entry.id === myAliasId ? ' leaderboard__row--you' : '');

                var rank = document.createElement('span');
                rank.className = 'leaderboard__rank';
                rank.textContent = '#' + MetroShared.formatRank(entry, index);

                var name = document.createElement('span');
                name.className = 'leaderboard__alias-name';
                name.textContent = entry.alias; // user text - textContent, never innerHTML

                var score = document.createElement('span');
                score.className = 'leaderboard__score';
                var badge = document.createElement('span');
                badge.className = 'leaderboard__score-badge';
                var number = document.createElement('span');
                number.className = 'leaderboard__score-number leaderboard__score-number--wide';
                number.textContent = entry.score;
                score.appendChild(badge);
                score.appendChild(number);

                li.appendChild(rank);
                li.appendChild(name);
                li.appendChild(score);
                li.appendChild(MetroShared.buildStreakBadge(entry.streak));
                leaderboardList.appendChild(li);
              });
            });
        }

        function renderAliasRow() {
          if (MetroShared.getAlias()) { hideAliasRow(); } else { showAliasInput(); }
        }

        function hideAliasRow() {
          // Once an alias is set, the player's own highlighted row below
          // already identifies them, so there's nothing to show here.
          leaderboardAliasRow.hidden = true;
          leaderboardAliasRow.innerHTML = '';
        }

        function showAliasInput() {
          leaderboardAliasRow.hidden = false;
          leaderboardAliasRow.innerHTML = '';

          var input = document.createElement('input');
          input.type = 'text';
          input.maxLength = 20;
          input.placeholder = 'Tu alias';
          input.setAttribute('aria-label', 'Tu alias para la tabla de posiciones');

          var saveBtn = document.createElement('button');
          saveBtn.type = 'button';
          saveBtn.className = 'btn-primary';
          saveBtn.textContent = 'Guardar';

          function save() {
            var normalized = MetroShared.setAlias(input.value);
            if (!normalized) return;
            hideAliasRow();
            submitScore();
          }

          saveBtn.addEventListener('click', save);
          input.addEventListener('keydown', function (e) { if (e.key === 'Enter') save(); });

          leaderboardAliasRow.appendChild(input);
          leaderboardAliasRow.appendChild(saveBtn);
        }

        // The shared results view - used both when a round ends and when a
        // saved result is reloaded on the same day.
        function renderReveal() {
          timeFill.style.width = '0%';
          timeText.textContent = '0:00'; // the round is over, on a fresh end or a reload
          MetroShared.renderNoticeBanner(revealNotice, 'notice--success', '¡Tiempo!',
            '🔥 ' + MetroShared.formatStreak(state.streak) + maxStreakLine(', '));
          revealNotice.hidden = false;
          renderRevealIcons();
          leaderboardEl.hidden = false;
          renderAliasRow();
          renderLeaderboard();
          // No replays of a daily deterministic board outside debug - same as
          // every other game; the button only returns under ?debug=true.
          startBtn.textContent = 'Jugar de nuevo';
          startBtn.hidden = !MetroShared.isDebugMode();
          boardStage.classList.add('board-stage--done'); // card grows to fit the full grid
          overlay.hidden = false;
        }

        function tick() {
          var remaining = state.endTime - performance.now();
          if (remaining <= 0) { finish(); return; }
          var secs = Math.ceil(remaining / 1000);
          timeText.textContent = Math.floor(secs / 60) + ':' + ('0' + (secs % 60)).slice(-2);
          timeFill.style.width = (remaining / ROUND_MS * 100) + '%';
          state.rafId = requestAnimationFrame(tick);
        }

        function start() {
          if (!ICONS.length) return;
          state.running = true;
          state.score = 0;
          state.found = [];
          state.leaderboardSubmitted = false;
          state.prevMajor = state.prevOdd = state.prevIndex = -1;
          // Seed the day's deterministic deal sequence (respects ?date= for QA).
          state.dateKey = MetroShared.getDateKey(MetroShared.getEffectiveToday());
          state.gameNumber = MetroShared.getGameNumberForDateKey(state.dateKey, START_DATE_KEY);
          rng = MetroShared.createSeededRandom('metrordle-copo-de-nieve-' + state.dateKey);
          state.endTime = performance.now() + ROUND_MS;
          timeFill.style.width = '100%'; // full bar at kickoff, before it counts down
          scoreText.textContent = '0';
          revealNotice.hidden = true;
          revealIcons.hidden = true;
          leaderboardEl.hidden = true;
          startBtn.hidden = false;
          boardStage.classList.remove('board-stage--done');
          overlay.hidden = true;
          nextRound();
          state.rafId = requestAnimationFrame(tick);
          startSaveTimer();
          persistProgress();
        }

        // Resume an in-progress round saved by persistProgress(): the deal
        // sequence is a pure function of the day + score, so replaying
        // nextRound() score+1 times (with the score each deal was dealt at,
        // for the ramp) restores the exact board and RNG position the player
        // left; then run the clock down from the saved remainder.
        function resumeGame(saved) {
          rng = MetroShared.createSeededRandom('metrordle-copo-de-nieve-' + state.dateKey);
          state.found = saved.found.slice();
          state.leaderboardSubmitted = false;
          state.prevMajor = state.prevOdd = state.prevIndex = -1;
          for (var k = 0; k <= saved.score; k++) { state.score = k; nextRound(); }
          state.score = saved.score;
          scoreText.textContent = state.score;
          state.endTime = performance.now() + saved.remainingMs;
          timeFill.style.width = (saved.remainingMs / ROUND_MS * 100) + '%';
          revealNotice.hidden = true;
          revealIcons.hidden = true;
          leaderboardEl.hidden = true;
          startBtn.hidden = true;
          boardStage.classList.remove('board-stage--done');
          overlay.hidden = true;
          state.running = true;
          state.rafId = requestAnimationFrame(tick);
          startSaveTimer();
        }

        function finish() {
          state.running = false;
          cancelAnimationFrame(state.rafId);
          clearInterval(saveTimer);
          state.leaderboardSubmitted = false;
          // "Won" = a non-zero score (no win/lose puzzle), same as Metro Crush.
          state.streak = MetroShared.updateStreakForResult(STREAK_STORAGE_KEY, state.dateKey, state.score > 0);
          state.maxStreak = MetroShared.loadStreak(STREAK_STORAGE_KEY).max;
          persistResult();
          renderReveal();
          submitScore();
        }

        // Resolves the day and its saved result once the icons are ready:
        // shows the reveal for an already-played day, or arms the start button.
        function initDay() {
          state.dateKey = MetroShared.getDateKey(MetroShared.getEffectiveToday());
          state.gameNumber = MetroShared.getGameNumberForDateKey(state.dateKey, START_DATE_KEY);
          gameNum.textContent = '#' + state.gameNumber;
          renderHighScoreRecord();

          var saved = loadSavedResult(state.dateKey);
          if (saved && saved.status === 'playing' && saved.remainingMs > 0) {
            resumeGame(saved); // an unfinished round - pick up where they left off
          } else if (saved) {
            var s = MetroShared.loadStreak(STREAK_STORAGE_KEY);
            state.score = saved.score;
            state.found = saved.found;
            state.leaderboardSubmitted = saved.leaderboardSubmitted;
            state.streak = s.count;
            state.maxStreak = s.max;
            scoreText.textContent = state.score;
            renderReveal();
            submitScore(); // retry if a prior attempt never landed (e.g. alias set later)
          } else {
            // Full timer on the pre-game ready screen, set instantly (the
            // 0.3s width transition would otherwise animate it up from empty).
            timeFill.style.transition = 'none';
            timeFill.style.width = '100%';
            void timeFill.offsetWidth;
            timeFill.style.transition = '';
            startBtn.disabled = false;
            startBtn.textContent = 'Comenzar';
          }
        }

        board.addEventListener('click', onBoardClick);
        startBtn.addEventListener('click', start);

        fetch('/station-icons.svg')
          .then(function (r) { return r.text(); })
          .then(function (text) {
            buildIcons(text);
            if (ICONS.length < 2) throw new Error('no icons');
            initDay();
          })
          .catch(function () {
            MetroShared.renderNoticeBanner(revealNotice, 'notice--error', 'Error',
              'No se pudieron cargar los iconos de las estaciones. Revisa tu conexión y recarga.');
            revealNotice.hidden = false;
          });
      })();
    </script>
  </body>
</html>
