<!DOCTYPE html>
<html
  lang="es-MX"
>
  <head>
    <meta charset="utf-8">
    <!--
      Tighter than the game pages' CSP (see index.html) since this page
      loads no Firebase SDK and renders no user-controlled data at all -
      defense-in-depth only.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Todos los minijuegos de Metrordle, el Metro de la CDMX.">
    <meta name="theme-color" content="#0057a8">

    <title>Juegos · Metrordle 🚇</title>

    <link rel="icon" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">

    <link rel="stylesheet" href="/shared.css">

    <!--
      Applies a saved theme override before first paint, so a light/dark
      choice doesn't flash the OS default for a frame on load - shared.js
      (loaded at the end of <body>) runs too late. Self-contained on
      purpose: mirrors shared.js's loadConfig()/applyThemeMode().
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('metrordle:config');
          var mode = raw && JSON.parse(raw).mode;
          if (mode === 'light' || mode === 'dark') {
            document.documentElement.setAttribute('data-theme', mode);
          }
        } catch (e) {}
      })();
    </script>

    <style>
      .juegos {
        padding: 0 1.1rem 1.3rem;
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <div class="brand">
        <svg class="brand__mark" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="1" y="6" width="22" height="12" rx="3" stroke="var(--ink)" stroke-width="2"/>
          <circle cx="7" cy="20" r="2" fill="var(--ink)"/>
          <circle cx="17" cy="20" r="2" fill="var(--ink)"/>
          <line x1="1" y1="11" x2="23" y2="11" stroke="var(--ink)" stroke-width="1.5"/>
        </svg>
        <span class="brand__text">Metrordle · Juegos</span>
        <a class="brand__settings" href="/configurar/" aria-label="Configuración" title="Configuración">⚙️</a>
      </div>

      <div class="sign">
        <div class="sign__head">
          <h1>Juegos</h1>
        </div>

        <div class="juegos" id="games-slot"></div>
      </div>
    </div>

    <script src="/shared.js"></script>
    <script>
      (function () {
        'use strict';
        // Same grid the end-screen promo is built from, but the whole set:
        // A-Z, with today's already-played games moved to the end and muted.
        var dateKey = MetroShared.getDateKey(new Date());
        document.getElementById('games-slot').appendChild(MetroShared.buildAllGamesGrid(dateKey));
      })();
    </script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </body>
</html>
