<!DOCTYPE html>
<html
  lang="es-MX"
>
  <head>
    <meta charset="utf-8">
    <!--
      Tighter than the game pages' CSP (see index.html) since this page
      loads no Firebase SDK and renders no user-controlled data at all -
      defense-in-depth only.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Todos los minijuegos de Metrordle, el Metro de la CDMX.">
    <meta name="theme-color" content="#0057a8">

    <title>Juegos · Metrordle 🚇</title>

    <link rel="icon" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">

    <link rel="stylesheet" href="/shared.css">

    <!--
      Applies a saved theme override before first paint, so a light/dark
      choice doesn't flash the OS default for a frame on load - shared.js
      (loaded at the end of <body>) runs too late. Self-contained on
      purpose: mirrors shared.js's loadConfig()/applyThemeMode().
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('metrordle:config');
          var mode = raw && JSON.parse(raw).mode;
          if (mode === 'light' || mode === 'dark') {
            document.documentElement.setAttribute('data-theme', mode);
          }
        } catch (e) {}
      })();
    </script>

    <style>
      .juegos {
        padding: 1.3rem 1.1rem;
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <div class="brand">
        <a class="brand__home" href="/juegos/" aria-label="Todos los juegos" title="Todos los juegos">
          <img class="brand__mark" src="/favicon.png" alt="" width="20" height="20">
        </a>
        <span class="brand__text">Juegos</span>
        <a class="brand__settings" href="/configurar/" aria-label="Configuración" title="Configuración"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
      </div>

      <div class="sign">
        <div class="juegos" id="games-slot"></div>
      </div>
    </div>

    <script src="/shared.js"></script>
    <script>
      (function () {
        'use strict';
        // Same grid the end-screen promo is built from, but the whole set:
        // A-Z, with today's already-played games moved to the end and muted.
        var dateKey = MetroShared.getDateKey(new Date());
        document.getElementById('games-slot').appendChild(MetroShared.buildAllGamesGrid(dateKey));
      })();
    </script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </body>
</html>
