<!DOCTYPE html>
<html
  lang="es-MX"
>
  <head>
    <meta charset="utf-8">
    <!--
      Same defense-in-depth note as Memoria/Laberinto: Firestore-sourced
      leaderboard data (aliases) is always rendered via textContent, never
      innerHTML - see renderLeaderboard() below. On top of that baseline,
      this page also needs: cdnjs for Leaflet's and MapLibre GL's JS/CSS
      (script-src and style-src); cdn.jsdelivr.net for the small
      maplibre-gl-leaflet bridge script that lets a MapLibre vector layer
      sit inside the Leaflet map (script-src); and OpenFreeMap's tile
      host for the actual map data. Unlike CARTO's old raster tiles
      (plain <img> elements), MapLibre fetches vector tiles/style/glyphs/
      sprite via fetch()/XHR, so OpenFreeMap needs connect-src too, not
      just img-src (img-src covers a sprite-image fallback path).
      gstatic.com is also in connect-src, not just script-src - with
      DevTools' source maps enabled, the browser fetches the Firebase
      SDK's own *.js.map files from the same host as a plain connect-src
      load, same as any other fetch. And MapLibre parses vector tiles in
      a background Worker it constructs from a blob: URL - worker-src
      isn't covered by script-src's own blob:-less allowlist (there's no
      automatic fallback the other way), so it needs its own directive.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: https://tiles.openfreemap.org; font-src 'self' data:; connect-src 'self' https://tiles.openfreemap.org https://firestore.googleapis.com https://*.googleapis.com https://www.gstatic.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="title" content="🗺️ Metroguessr · Metrordle">
    <meta
      name="description"
      content="Adivina la estación del Metro CDMX marcada en el mapa antes de que se acaben tus 5 intentos."
    >

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://metrordle.com/metroguessr/">
    <meta property="og:title" content="🗺️ Metroguessr · Metrordle">
    <meta property="og:description" content="Adivina la estación del Metro CDMX marcada en el mapa antes de que se acaben tus 5 intentos.">
    <meta property="og:image" content="https://metrordle.com/images/og-image--1200-715.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="715">
    <meta property="og:image:alt" content="Un tablero estilo Wordle deletrea METRORDLE, con el logo del Metro de la Ciudad de México y la silueta de la ciudad en dos de las casillas.">

    <meta name="theme-color" content="#0057a8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Metrordle: Metroguessr">

    <title>🗺️ Metroguessr · Metrordle</title>

    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <link rel="stylesheet" href="/shared.css">

    <!--
      Applies a saved theme override (see /configurar/) before first
      paint, so a light/dark choice doesn't flash the OS default for a
      frame - shared.js (loaded at the end of <body>) runs too late for
      that. Self-contained on purpose: mirrors shared.js's own
      loadConfig()/applyThemeMode(), but shared.js hasn't loaded yet at
      this point in <head>.
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('metrordle:config');
          var mode = raw && JSON.parse(raw).mode;
          if (mode === 'light' || mode === 'dark') {
            document.documentElement.setAttribute('data-theme', mode);
          }
        } catch (e) {}
      })();
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.12.0/maplibre-gl.css">

    <style>
      html, body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        position: relative;
        background: var(--paper-well);
      }

      /* --- full-bleed map background --- */

      .map-stage {
        position: fixed;
        inset: 0;
        background: var(--paper-well);
      }

      /* Leaflet's own default CSS paints its container a fixed #ddd
         regardless of theme - this overrides it (an id selector already
         beats leaflet.css's .leaflet-container class) so the gap while
         tiles are still loading matches the page instead of flashing
         light gray/white in dark mode. */
      #leaflet-map {
        width: 100%;
        height: 100%;
        background: var(--paper-well);
      }

      /* --ink flips dark (light mode) / light (dark mode) with the
         theme, same as everything else on this page that needs to
         read against a background that itself flips - a hardcoded
         white stroke/fill here was invisible against light mode's own
         pale map tiles. */
      .target-marker {
        stroke: var(--ink);
        stroke-width: 3;
        fill: var(--ink);
        fill-opacity: 0.22;
      }

      .target-marker--live { animation: pulse 1.8s ease-in-out infinite; }

      /* --reveal-line-color set inline by applyHintEffects() once the
         "reveal línea" hint is used - recolors the otherwise-neutral
         live marker to the target's real line color. The line NUMBER
         itself is named by the separate .hint-line-badge marker below,
         since color alone isn't enough (including for a colorblind
         player). */
      .target-marker--line-revealed {
        stroke: var(--reveal-line-color, var(--ink));
        fill: var(--reveal-line-color, var(--ink));
        fill-opacity: 0.45;
      }

      /* The "reveal línea" hint's own badge - a small divIcon marker
         (see applyHintEffects()) pinned right on top of the live
         circle marker, showing just the line's short id ('4', 'A',
         '12', ...). Sized a bit bigger than the live marker's own
         resting radius (22px across at rest) so the number stays
         legible. Same --badge-bg/--badge-ink custom-property
         convention as .target-icon-marker's own reveal badge. */
      .hint-line-badge {
        background: var(--badge-bg, var(--ink));
        color: var(--badge-ink, var(--paper));
        border-radius: 50%;
        box-shadow: 0 2px 8px var(--shadow), 0 0 0 2px var(--paper);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Overpass', sans-serif;
        font-weight: 800;
        font-size: 0.95rem;
      }

      @keyframes pulse {
        0%, 100% { r: 11; stroke-opacity: 0.95; }
        50% { r: 17; stroke-opacity: 0.3; }
      }

      @media (prefers-reduced-motion: reduce) {
        .target-marker--live { animation: none; }
      }

      /* Reveal marker: the station's own pictogram on a badge colored with
         its Metro line (shape/background now shared.css's own .station),
         swapped in for the plain circle once the round ends. Passing our
         own `className` to L.divIcon() replaces Leaflet's default
         'leaflet-div-icon' class outright (rather than adding to it), so
         this only needs to target our own class, not that default one.
         The box-shadow is page-local - needed to pop against the map
         tiles underneath, not needed by .station's other consumers. */
      .target-icon-marker {
        box-shadow: 0 2px 10px var(--shadow), 0 0 0 2px var(--paper);
      }

      /* Same pill look as the (now-hidden-on-reveal) .history-chip, but
         pinned to the guessed station's own map coordinate instead of
         sitting in the history row - see paintGuessMarkers() below. A
         custom className on L.divIcon() replaces Leaflet's default
         'leaflet-div-icon' outright (same trick as .target-icon-marker
         above).
         .guess-marker itself is Leaflet's own icon element - it
         positions markers by setting that exact element's inline
         `transform: translate3d(x,y,0)` on every update (see
         L.DomUtil.setPosition()), which silently overwrites any
         `transform` this stylesheet gives the SAME element (inline
         style always wins a same-property conflict, regardless of
         selector specificity). Centering therefore has to live on a
         nested child instead - .guess-marker__pill - whose own
         `transform: translate(-50%, -50%)` Leaflet never touches. */
      .guess-marker { position: relative; }

      .guess-marker__pill {
        position: absolute;
        left: 0;
        top: 0;
        transform: translate(-50%, -50%);
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        padding: 0.25rem 0.5rem;
        background: var(--paper-well);
        border: 1.5px solid var(--rule);
        border-radius: 999px;
        font-family: 'Overpass', sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        color: var(--ink);
        white-space: nowrap;
        box-shadow: 0 2px 8px var(--shadow);
      }

      .guess-marker__dist { font-variant-numeric: tabular-nums; }
      .guess-marker__dir { font-size: 0.85rem; line-height: 1; }

      /* --- floating topbar --- */

      .topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 500;
        padding: max(0.85rem, env(safe-area-inset-top)) 1rem 0.6rem;
        background: color-mix(in srgb, var(--paper) 66%, transparent);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        border-bottom: 1px solid var(--rule);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.3rem;
      }

      h1 {
        font-family: 'Overpass', sans-serif;
        font-weight: 800;
        font-size: 1.25rem;
        letter-spacing: -0.01em;
        margin: 0;
        text-wrap: balance;
      }

      /* .topbar is a centered column layout (see above), not a
         .brand row like every other page's own settings link sits in
         - positioned in its top-right corner instead, same fixed
         positioning context .topbar itself already establishes. */
      .topbar__settings {
        position: absolute;
        top: max(0.85rem, env(safe-area-inset-top));
        right: 1rem;
        font-size: 1.05rem;
        line-height: 1;
        text-decoration: none;
        opacity: 0.7;
      }

      .topbar__settings:hover,
      .topbar__settings:focus-visible {
        opacity: 1;
      }

      .date-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .date-row[hidden] { display: none; }

      .date-debug-label {
        color: var(--ink-soft);
        font-size: 0.78rem;
        font-variant-numeric: tabular-nums;
        min-width: 6rem;
        text-align: center;
      }

      .pips {
        display: flex;
        gap: 0.4rem;
        margin-top: 0.1rem;
      }

      .pip {
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 50%;
        background: var(--rule);
        transition: background 0.2s ease;
      }

      .pip--used { background: var(--danger); }
      .pip--win { background: var(--ok); }

      /* --- bottom sheet panel ---
         Split in two: .panel is the full-bleed shell (background, blur,
         top border, shadow) that always spans edge-to-edge, so there's
         never a side border sitting awkwardly at the screen's own edge
         on a narrow phone. .panel__inner is what actually caps at the
         old 27rem max-width and centers - same visual width as before
         on anything wider than that, just without the outer shell
         itself narrowing (and exposing side borders) along with it. */
      .panel {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 500;
        background: color-mix(in srgb, var(--paper-raised) 66%, transparent);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        border-top: 1px solid var(--rule);
        box-shadow: 0 -6px 24px var(--shadow);
      }

      .panel__inner {
        max-width: 27rem;
        margin: 0 auto;
        max-height: 60vh;
        padding: 0.7rem 1.1rem calc(0.9rem + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
      }

      /* .panel's own content - the guess form while playing, then the
         reveal's banner/leaderboard/share button, up to .panel__inner's
         own 60vh cap - can crowd out most of the map, which is always
         worth seeing clearly: the target's own live marker is pinned on
         it from the very first guess, not just once the round ends (see
         recenterMapOnTarget() in this page's own script). This just
         toggles .panel's own visibility and recenters - the map
         underneath is already full-bleed (.map-stage,
         position:fixed;inset:0) and never resizes, so there's no
         container reflow to do. Sits in the map's own top-right corner,
         below the topbar (--topbar-h, same convention as .leaflet-top's
         own zoom-control offset above) so it never collides with either
         the topbar or (once un-hidden again) the sheet itself. Shown
         throughout the whole round, not just once it ends - see
         finishStartingGame() - starting out hidden here only as this
         page's usual pre-JS-init default, same convention as
         .date-row's own `hidden` attribute above. */
      .map-maximize-btn {
        position: fixed;
        top: calc(var(--topbar-h, 4.5rem) + 0.6rem);
        right: 0.6rem;
        z-index: 600;
        width: 2.4rem;
        height: 2.4rem;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.15rem;
        line-height: 1;
        color: var(--ink);
        background: var(--paper-well);
        border: 1.5px solid var(--rule);
        border-radius: 50%;
        box-shadow: 0 2px 8px var(--shadow);
        cursor: pointer;
      }

      .map-maximize-btn[hidden] { display: none; }

      body.map-maximized .panel { display: none; }

      .guess-form {
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
        flex: none;
      }

      .guess-form[hidden] { display: none; }

      .search-box { position: relative; flex: none; }

      /* Visuals come from the shared input[type="text"] in shared.css;
         this is just the full-width sizing for the search box. */
      .search-box input { width: 100%; }

      .suggestions {
        position: absolute;
        bottom: calc(100% + 0.3rem);
        left: 0;
        right: 0;
        background: var(--paper-raised);
        border: 1px solid var(--rule);
        border-radius: 0.5rem;
        box-shadow: 0 -4px 14px var(--shadow);
        max-height: 11rem;
        overflow-y: auto;
        z-index: 5;
      }

      .suggestions[hidden] { display: none; }

      .suggestion {
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        font-family: inherit;
        font-size: 0.9rem;
        color: var(--ink);
        padding: 0.55rem 0.8rem;
        cursor: pointer;
      }

      .suggestion:not(:last-child) { border-bottom: 1px solid var(--rule); }
      .suggestion:hover, .suggestion--active { background: var(--paper-well); }

      .status-line {
        flex: none;
        text-align: center;
        font-size: 0.82rem;
        color: var(--ink-soft);
        min-height: 1.1rem;
        margin: 0;
      }

      /* The hint button is the secondary small variant (.btn-secondary
         btn-secondary--sm). This overrides .btn-secondary's own default
         1.1rem top margin with the tighter standalone spacing it needs
         sitting outside the guess form; .btn-secondary[hidden] in
         shared.css is what lets its hidden-property toggle
         (renderHintButton()) still hide it despite display:block. */
      .hint-btn {
        flex: none;
        margin-top: 0.5rem;
      }

      /* flex:1 1 auto + min-height:0 (rather than the flex:none every
         other child here uses) lets this shrink and scroll internally
         once the leaderboard makes it taller than .panel__inner's own
         max-height, instead of pushing content off the bottom of the
         screen - .panel__inner itself stays overflow:visible so the
         guess suggestions dropdown (only ever shown while this is
         hidden) isn't clipped by a scroll container. */
      .reveal {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
      }
      .reveal[hidden] { display: none; }

      /* .leaderboard* styling itself lives in shared.css, common to every
         game with a leaderboard - these are just this page's own deltas,
         sized down a bit further to fit the compact bottom sheet, plus
         text-align:left since .reveal (its parent here) centers text. */
      .leaderboard {
        margin-bottom: 0.6rem;
        text-align: left;
      }

      .leaderboard__title { font-size: 0.85rem; margin: 0 0 0.4rem; }
      .leaderboard__alias { font-size: 0.82rem; margin-bottom: 0.5rem; }
      .leaderboard__list { margin: 0 0 0.5rem; }
      .leaderboard__row { font-size: 0.82rem; padding: 0.35rem 0.55rem; }
      .leaderboard__status { font-size: 0.8rem; margin: 0 0 0.5rem; }

      /* Badge-next-to-the-number hard-mode display, same trick as
         Metrordle's own leaderboard (.leaderboard__score-badge itself
         is shared, see shared.css). gap keeps a breathing space between
         the two now that the badge itself is right-aligned (see
         .leaderboard__score-badge below) - without it, a right-aligned
         badge would butt straight up against the number with no
         visible separation. */
      .leaderboard__score {
        align-items: center;
        display: flex;
        gap: 0.4rem;
      }

      /* Widened past shared.css's own 1.1rem, and nowrap added - unlike
         every other game's leaderboard, this badge can hold up to three
         emoji at once (up to two 🪄, one per hint used, plus 🧠 - see
         renderLeaderboard()), not just one, and shared.css's own rule
         never needed to keep multiple emoji on one line. Right-aligned
         (overriding shared.css's own centered default) so a 1- or
         2-emoji row's icons sit close to the score number (separated by
         .leaderboard__score's own gap above) instead of floating in the
         middle of this wider column. */
      .leaderboard__score-badge {
        width: 3.4rem;
        white-space: nowrap;
        text-align: right;
      }

      /* Fixed at a single digit's width (matching Metrordle's own
         leaderboard) now that the "intento(s)" suffix is gone - every
         row's number lands in the same spot regardless of its own or
         its neighbors' badge contents, giving the whole list a
         table-like column alignment. */
      .leaderboard__score-number {
        flex: none;
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        text-align: right;
        width: 1rem;
      }

      .history-scroll { flex: none; max-height: 4.6rem; overflow-y: auto; }
      .history { display: flex; flex-wrap: wrap; gap: 0.4rem; }

      /* Station name is dropped from the compact chip (available via the
         title attribute on hover/long-press) - with only 5 attempts,
         distance + direction is enough to scan at a glance. */
      .history-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        padding: 0.3rem 0.55rem;
        background: var(--paper-well);
        border-radius: 999px;
        font-size: 0.78rem;
        font-weight: 700;
        white-space: nowrap;
      }

      .history-chip__dist { font-variant-numeric: tabular-nums; }
      .history-chip__dir { font-size: 0.95rem; line-height: 1; }

      /* Leaflet's own controls, restyled minimally to sit on our paper theme */
      .leaflet-control-attribution {
        background: color-mix(in srgb, var(--paper-well) 80%, transparent) !important;
        color: var(--ink-soft) !important;
        font-family: 'Overpass', sans-serif !important;
        font-size: 0.62rem !important;
      }

      .leaflet-control-attribution a { color: var(--ink-soft) !important; }

      .leaflet-control-zoom a {
        background: var(--paper-raised) !important;
        color: var(--ink) !important;
        border-color: var(--rule) !important;
      }

      .leaflet-control-zoom a:hover { background: var(--paper-well) !important; }

      /* The zoom control (top-left by default) would otherwise render
         right under the fixed topbar, which sits in its own stacking
         context above the map and so visually covers it. --topbar-h is
         kept in sync with the topbar's actual rendered height (it varies
         with the debug date-row) via a ResizeObserver below. */
      .leaflet-top { margin-top: calc(var(--topbar-h, 4.5rem) + 0.6rem); }
    </style>
  </head>
  <body>
    <div class="mode-modal" id="mode-modal" hidden>
      <div class="mode-modal__backdrop"></div>
      <div class="mode-modal__card" role="dialog" aria-modal="true" aria-labelledby="mode-modal-title">
        <h2 id="mode-modal-title">Elige tu modo</h2>
        <p class="mode-modal__dek">¿Cómo quieres jugar el Metroguessr de hoy?</p>
        <div class="mode-modal__options">
          <button type="button" class="mode-option" id="mode-normal-btn">
            <span class="mode-option__title">Normal</span>
            <span class="mode-option__desc">Puedes mover y hacer zoom en el mapa</span>
          </button>
          <button type="button" class="mode-option" id="mode-hard-btn">
            <span class="mode-option__title">Difícil</span>
            <span class="mode-option__desc">El mapa está bloqueado mientras juegas</span>
          </button>
        </div>
      </div>
    </div>

    <div class="map-stage">
      <div id="leaflet-map"></div>
    </div>

    <button type="button" class="map-maximize-btn" id="map-maximize-btn" hidden aria-label="Ampliar mapa" title="Ampliar mapa">⛶</button>

    <div class="topbar">
      <a class="topbar__settings" href="/configurar/" aria-label="Configuración" title="Configuración">⚙️</a>
      <h1 id="game-title">Metrordle: Metroguessr</h1>
      <div class="date-row" id="date-row" hidden>
        <button type="button" class="btn-secondary btn-secondary--chev btn-secondary--chev-sm" id="date-prev" aria-label="Día anterior" data-chev="left"></button>
        <span class="date-debug-label" id="date-debug-label"></span>
        <button type="button" class="btn-secondary btn-secondary--chev btn-secondary--chev-sm" id="date-next" aria-label="Día siguiente" data-chev="right"></button>
        <span class="debug-mode-toggle">
          <button type="button" class="debug-mode-toggle__btn" id="debug-mode-normal" aria-label="Ver modo normal">Normal</button>
          <button type="button" class="debug-mode-toggle__btn" id="debug-mode-hard" aria-label="Ver modo difícil">Difícil</button>
        </span>
      </div>
      <div class="pips" id="pips"></div>
    </div>

    <div class="panel">
      <div class="panel__inner">
        <div class="guess-form" id="guess-form">
          <div class="search-box">
            <input type="text" id="guess-input" autocomplete="off" aria-label="¿Qué estación es?" placeholder="Escribe el nombre de una estación&hellip;">
            <div class="suggestions" id="suggestions" hidden></div>
          </div>
          <button type="button" class="btn-primary btn-primary--sm" id="guess-btn" disabled>Adivinar</button>
        </div>

        <p class="status-line" id="status-line"></p>

        <button type="button" class="btn-secondary btn-secondary--sm hint-btn" id="hint-btn" hidden></button>

        <div class="reveal" id="reveal" hidden>
          <div id="reveal-banner"></div>

          <div class="leaderboard" id="leaderboard">
            <h2 class="leaderboard__title">Mejores 5 puntajes hoy</h2>
            <div class="leaderboard__alias" id="leaderboard-alias-row"></div>
            <ol class="leaderboard__list" id="leaderboard-list"></ol>
            <p class="leaderboard__status" id="leaderboard-status" hidden></p>
          </div>

          <button type="button" class="btn-secondary btn-secondary--sm" id="share-btn">Compartir</button>

          <div id="game-promo-slot"></div>
        </div>

        <div class="history-scroll" id="history-scroll">
          <div class="history" id="history"></div>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.12.0/maplibre-gl.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.1.3/leaflet-maplibre-gl.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="/firebase-config.js"></script>
    <script src="/shared.js"></script>
    <script>
      (function () {
        'use strict';

        // Station coordinates live in shared.js now
        // (MetroShared.STATION_COORDS) so the /map/ diagnostic page and
        // this game read the exact same recorded data.
        var STATIONS = MetroShared.STATION_COORDS;

        function shuffle(array, rand) {
          var copy = array.slice();
          for (var i = copy.length - 1; i > 0; i--) {
            var j = Math.floor(rand() * (i + 1));
            var tmp = copy[i];
            copy[i] = copy[j];
            copy[j] = tmp;
          }
          return copy;
        }

        // A single fixed shuffle of every station, seeded once (not per
        // day) - this guarantees no station repeats until every other
        // one has come up, unlike picking independently at random each
        // day the way this used to work, which could (and did - games
        // #5 and #6 landed on the same station) put the same station up
        // on two different days well before the full list was
        // exhausted. Only used from NO_REPEAT_CUTOVER_DATE_KEY on -
        // see pickTarget() below - but computed unconditionally since
        // it's cheap and every day from the cutover onward needs it.
        var STATION_ORDER = shuffle(
          STATIONS.map(function (s) { return s[0]; }),
          MetroShared.createSeededRandom('metrordle-metroguessr-station-order')
        );

        var START_DATE_KEY = '2026-09-12';

        // Everything up to (not including) this date keeps the original
        // per-day independent pick, exactly as it always worked -
        // switching every past day over to the STATION_ORDER scheme
        // would silently change what an already-played day's puzzle
        // was for anyone replaying it via the debug date-nav, which is
        // worse than the rare collision (see games #5 and #6 above)
        // that prompted this fix in the first place. Every day from
        // here on gets the no-repeat guarantee instead.
        var NO_REPEAT_CUTOVER_DATE_KEY = '2026-09-18';

        // dateKey and NO_REPEAT_CUTOVER_DATE_KEY are both zero-padded
        // 'YYYY-MM-DD' strings, so a plain string comparison already
        // sorts chronologically - no Date parsing needed.
        function pickTarget(dateKey, gameNumber) {
          if (dateKey < NO_REPEAT_CUTOVER_DATE_KEY) {
            var rand = MetroShared.createSeededRandom('metrordle-metroguessr-' + dateKey);
            var idx = Math.floor(rand() * STATIONS.length);
            return STATIONS[idx][0];
          }

          // gameNumber - 1 indexes into the fixed STATION_ORDER
          // permutation, wrapping via modulo once a full cycle
          // completes - still fully deterministic (every player
          // computes the identical sequence from gameNumber alone) and
          // needs no persisted state. Wrapped with an extra
          // + STATION_ORDER.length before the final % so a gameNumber
          // at or before START_DATE_KEY (reachable via the debug
          // date-nav, where it can go to 0 or negative) still lands on
          // a valid, positive index instead of JS's negative-modulo
          // result for a negative dividend.
          var orderIdx = (((gameNumber - 1) % STATION_ORDER.length) + STATION_ORDER.length) % STATION_ORDER.length;
          return STATION_ORDER[orderIdx];
        }

        var MAX_ATTEMPTS = 5;
        // The map fills the full viewport width, so a narrow phone
        // screen covers noticeably less real-world ground than a wide
        // desktop browser window at the identical zoom level - one
        // level further out (a lower number, wider field of view) on a
        // narrow viewport closes most of that gap.
        var MAP_ZOOM = (window.matchMedia && window.matchMedia('(max-width: 480px)').matches) ? 14 : 15;
        // OpenFreeMap's vector styles - no API key, no request cap, free
        // for good (donation-funded), unlike the CARTO raster tiles this
        // replaced. Loaded via the maplibre-gl-leaflet bridge (see
        // setTileLayer() below) so the rest of this file keeps using
        // Leaflet's own marker/interactivity API untouched - only the
        // tile engine underneath changed. Each style already has its own
        // light/dark variant; unlike CARTO, there's no separate
        // "no labels" style, so applyLabelVisibility() below hides/shows
        // every label (symbol-type) layer directly instead of swapping
        // URLs.
        var MAPLIBRE_STYLES = {
          light: 'https://tiles.openfreemap.org/styles/positron',
          dark: 'https://tiles.openfreemap.org/styles/dark',
        };
        var TILE_ATTRIBUTION = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, tiles by <a href="https://openfreemap.org">OpenFreeMap</a>';
        var SHARE_URL = 'https://metrordle.com/metroguessr/';
        var STREAK_STORAGE_KEY = 'metroguessr:streak';
        var LEADERBOARD_COLLECTION = 'metroguessr-leaderboard';
        var LEADERBOARD_SIZE = 5;

        function $(id) { return document.getElementById(id); }

        function storageKeyFor(dateKey) {
          return 'metroguessr:' + dateKey;
        }

        // The target itself isn't stored - it's re-derived from dateKey
        // via the same seeded pick every load, same as every other game
        // here. Only the player's own guesses (and whether the round is
        // over) are session state worth persisting.
        // A save from before state.timeline existed has no record of
        // WHEN each hint was used relative to the guesses around it -
        // only that it was used at all (hintsUsed) and how many guesses
        // happened in total (guesses.length). The only honest guess at
        // a timeline for one of those is every guess first, then every
        // hint after - not necessarily what really happened, but the
        // same order the share text always showed before state.timeline
        // existed, so an in-progress or already-done round saved by an
        // older version doesn't change how it displays just from
        // loading it under this version. Once a new guess or hint
        // actually happens on an in-progress round, it's appended for
        // real after this synthesized prefix, same as any other entry.
        function synthesizeTimeline(guessCount, hintsUsed) {
          var timeline = [];
          for (var g = 0; g < guessCount; g++) timeline.push({ kind: 'guess' });
          for (var h = 0; h < hintsUsed; h++) timeline.push({ kind: 'hint' });
          return timeline;
        }

        function loadSavedState(dateKey) {
          try {
            var raw = localStorage.getItem(storageKeyFor(dateKey));
            if (!raw) return null;
            var parsed = JSON.parse(raw);
            if (!parsed || !Array.isArray(parsed.guesses)) return null;
            // leaderboardSubmitted was added after this key's format
            // shipped, so a result saved by an older version won't have
            // it - falling back to false just means one harmless
            // retry-submit next load, same as a genuine earlier failure
            // would cause (see submitScore()). mode is newer still - a
            // save from before the normal/hard split didn't have a
            // choice to make, so it defaults to 'hard', the locked-map
            // behavior that existed back then.
            var hintsUsed = typeof parsed.hintsUsed === 'number' ? parsed.hintsUsed : 0;
            return {
              guesses: parsed.guesses,
              done: !!parsed.done,
              leaderboardSubmitted: !!parsed.leaderboardSubmitted,
              mode: parsed.mode === 'normal' ? 'normal' : 'hard',
              // hintsUsed is newer too - a save from before hints existed
              // just means no hint was ever used, i.e. 0.
              hintsUsed: hintsUsed,
              // timeline is newer still - see synthesizeTimeline()'s own
              // comment for a save that predates it.
              timeline: Array.isArray(parsed.timeline) ? parsed.timeline : synthesizeTimeline(parsed.guesses.length, hintsUsed),
            };
          } catch (e) {
            return null;
          }
        }

        function persistState() {
          try {
            localStorage.setItem(storageKeyFor(state.dateKey), JSON.stringify({
              guesses: state.guesses,
              done: state.done,
              leaderboardSubmitted: state.leaderboardSubmitted,
              mode: state.mode,
              hintsUsed: state.hintsUsed,
              timeline: state.timeline,
            }));
          } catch (e) {
            // localStorage unavailable (private mode, quota, etc.) - the
            // game stays playable for this session, it just won't persist.
          }
        }

        function stripAccents(s) {
          return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        }

        // Great-circle distance between two lat/lng points, in km, via the
        // Haversine formula. Treats Earth as a sphere of radius R = 6371 km
        // (its mean radius) rather than the true oblate spheroid - the
        // resulting error is a fraction of a percent, which is irrelevant
        // at the city scale this game deals in (a few dozen km at most).
        //
        // Derivation: for two points with latitude/longitude differences
        // dLat/dLng (in radians), the haversine of the central angle
        // between them is
        //   hav(angle) = sin²(dLat/2) + cos(lat1)·cos(lat2)·sin²(dLng/2)
        // `h` below computes exactly that. Taking asin(sqrt(h)) recovers
        // half the central angle, so doubling it and multiplying by R
        // converts the angle into an arc length along the sphere's surface.
        function haversineKm(a, b) {
          var R = 6371;
          var dLat = (b.lat - a.lat) * Math.PI / 180;
          var dLng = (b.lng - a.lng) * Math.PI / 180;
          var lat1 = a.lat * Math.PI / 180, lat2 = b.lat * Math.PI / 180;
          var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
          var km = 2 * R * Math.asin(Math.sqrt(h));
          // Temporary diagnostic logging while chasing a report of
          // distances that don't match the guess/target pins' visual
          // positions on the map - remove once that's confirmed fixed.
          // Logs the raw input points (not just names) since a bad
          // lookup upstream (wrong station resolved to the wrong
          // coordinate) would otherwise look identical to a bad
          // formula from here alone.
          console.log('[Distance] haversineKm a=' + JSON.stringify(a) + ' b=' + JSON.stringify(b) +
            ' dLat=' + dLat.toFixed(6) + ' dLng=' + dLng.toFixed(6) + ' h=' + h.toFixed(8) +
            ' -> ' + km.toFixed(4) + ' km');
          return km;
        }

        // Initial compass bearing from `from` to `to`, collapsed to one of
        // 8 arrow glyphs (N/NE/E/SE/S/SW/W/NW), for the "which way was I
        // off" hint shown after a wrong guess.
        //
        // The bearing formula below is the standard spherical-trigonometry
        // one for initial bearing on a great-circle path:
        //   y = sin(dLng)·cos(lat2)
        //   x = cos(lat1)·sin(lat2) - sin(lat1)·cos(lat2)·cos(dLng)
        //   bearing = atan2(y, x)
        // atan2 returns radians in (-180°, 180°], measured clockwise from
        // north but negative to the west of it; `+ 360) % 360` shifts that
        // into the usual 0-360° compass range. Dividing by 45° and rounding
        // then buckets the bearing into one of 8 equal 45°-wide octants
        // (e.g. anything from 337.5° to 22.5° rounds to octant 0, "north"),
        // and `% 8` wraps the one case (exactly 360°) that would otherwise
        // round up past the last index back to octant 0.
        function bearingArrow(from, to) {
          var lat1 = from.lat * Math.PI / 180, lat2 = to.lat * Math.PI / 180;
          var dLng = (to.lng - from.lng) * Math.PI / 180;
          var y = Math.sin(dLng) * Math.cos(lat2);
          var x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLng);
          var deg = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
          var arrows = ['↑', '↗', '→', '↘', '↓', '↙', '←', '↖'];
          return arrows[Math.round(deg / 45) % 8];
        }

        var stationByName = {};
        STATIONS.forEach(function (s) { stationByName[s[0]] = { lat: s[1], lng: s[2] }; });

        // A station on more than one line (an interchange) just takes the
        // first match in MetroShared.LINES's own order - there's no single
        // "correct" line to prefer for those, so this keeps it deterministic
        // rather than picking one some other way.
        function lineForStation(name) {
          for (var i = 0; i < MetroShared.LINES.length; i++) {
            if (MetroShared.LINES[i].stations.indexOf(name) !== -1) return MetroShared.LINES[i];
          }
          return null;
        }

        // Same pictogram-on-a-badge look as Metro Crush's board tiles: the
        // station's icon (from the shared /station-icons.svg sprite,
        // fill="currentColor" inside each <symbol>) on a circle colored
        // with its Metro line, icon tinted with the line's own text color.
        function buildStationIconEl(name) {
          var slug = MetroShared.STATION_ICON_SLUGS[name];
          if (!slug) return null;
          var svgNS = 'http://www.w3.org/2000/svg';
          var svg = document.createElementNS(svgNS, 'svg');
          svg.setAttribute('aria-hidden', 'true');
          var use = document.createElementNS(svgNS, 'use');
          use.setAttributeNS('http://www.w3.org/1999/xlink', 'href', '/station-icons.svg#' + slug);
          use.setAttribute('href', '/station-icons.svg#' + slug);
          svg.appendChild(use);
          return svg;
        }

        // An explicit /configurar/ choice overrides the OS preference for
        // every other piece of styling on this page (shared.css's own
        // [data-theme] rules) - the map tile style needs to follow the
        // same choice instead of querying prefers-color-scheme directly,
        // or a "Claro"/"Oscuro" override would leave the chrome one
        // theme and the map tiles the OS's, mismatched.
        function prefersDark() {
          var mode = MetroShared.getThemeMode();
          if (mode === 'dark') return true;
          if (mode === 'light') return false;
          return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        }

        // Keeps --topbar-h (used to push the zoom control below the
        // topbar, see .leaflet-top) in sync with its actual rendered
        // height, which changes when the debug date-row shows/hides.
        var topbarEl = document.querySelector('.topbar');
        function syncTopbarHeight() {
          document.documentElement.style.setProperty('--topbar-h', topbarEl.offsetHeight + 'px');
        }
        syncTopbarHeight();
        if (window.ResizeObserver) {
          new ResizeObserver(syncTopbarHeight).observe(topbarEl);
        } else {
          window.addEventListener('resize', syncTopbarHeight);
        }

        var map = L.map('leaflet-map', {
          zoomControl: false,
          dragging: false,
          touchZoom: false,
          scrollWheelZoom: false,
          doubleClickZoom: false,
          boxZoom: false,
          keyboard: false,
          attributionControl: false,
        }).setView([19.4326, -99.1332], MAP_ZOOM);

        L.control.attribution({ prefix: false, position: 'bottomright' })
          .addAttribution(TILE_ATTRIBUTION)
          .addTo(map);

        var glLayer = null;
        var glStyleReady = false;
        var showLabels = false;

        // Every symbol-type layer in the current style is a label (place
        // names, road names, POI icons+text) - hiding all of them,
        // rather than hardcoding OpenFreeMap's own layer names, keeps
        // this working even if a future style revision renames or
        // reshuffles its layers. No-ops until glStyleReady is set (see
        // setTileLayer() below) - the pending listener there re-applies
        // this once the style actually is ready.
        function applyLabelVisibility() {
          if (!glLayer || !glStyleReady) return;
          var glMap = glLayer.getMaplibreMap();
          var visibility = showLabels ? 'visible' : 'none';
          glMap.getStyle().layers.forEach(function (layer) {
            if (layer.type === 'symbol') glMap.setLayoutProperty(layer.id, 'visibility', visibility);
          });
        }

        function setTileLayer() {
          if (glLayer) map.removeLayer(glLayer);
          glStyleReady = false;
          glLayer = L.maplibreGL({
            style: MAPLIBRE_STYLES[prefersDark() ? 'dark' : 'light'],
            attributionControl: false,
          }).addTo(map);

          // isStyleLoaded()/'styledata' (tried first) turned out to be
          // gated on the style's TILE data finishing too, not just the
          // style definition itself - under any kind of tile-loading
          // slowness (a flaky connection, or the worker-src CSP block
          // that briefly existed here) that condition could take a long
          // time to ever become true, leaving labels stuck visible the
          // whole time. MapLibre's own 'style.load' event would be the
          // clean fix but isn't available before v6 (this page pins
          // v5). The well-established, version-independent signal that
          // the style itself (not its tiles) is ready is the 'data'
          // event with dataType 'style' - it doesn't require removing
          // the listener defensively since it only ever needs to fire
          // once per style, handled here by unregistering as soon as it
          // does.
          var glMap = glLayer.getMaplibreMap();
          function onStyleData(e) {
            if (e.dataType !== 'style') return;
            glMap.off('data', onStyleData);
            glStyleReady = true;
            applyLabelVisibility();
          }
          glMap.on('data', onStyleData);
        }

        // Unlike CARTO's raster tiles (a genuinely different URL per
        // labels state, so toggling always meant a full reload), a
        // vector style can show/hide its own label layers in place -
        // this flips just those layers on the already-loaded style
        // instead of tearing down and refetching the whole map.
        function setLabelsVisible(visible) {
          showLabels = visible;
          applyLabelVisibility();
        }

        setTileLayer();

        // Re-evaluates prefersDark() on an OS-level scheme change while
        // the page is open - a no-op re-render when an explicit
        // /configurar/ override is set (prefersDark() ignores the OS
        // value in that case), live-updating the tiles only in 'system'
        // mode, same as everywhere else this page follows the OS.
        if (window.matchMedia) {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', setTileLayer);
        }

        var targetMarker = L.circleMarker([19.4326, -99.1332], {
          radius: 11,
          className: 'target-marker',
          interactive: false,
        }).addTo(map);

        // The revealed station's icon badge, swapped in for targetMarker
        // once a round ends (built fresh each reveal since it depends on
        // that day's target/line).
        var targetIconMarker = null;

        // The "reveal línea" hint's own small badge, pinned on top of
        // the live targetMarker while a round is still in progress - see
        // applyHintEffects(). Cleared there (never rebuilt until the
        // next hint is actually used) and in showReveal() once the
        // round ends.
        var hintLineMarker = null;

        // One pin per wrong guess, placed at that guess's own station
        // right after the guess that made it - see paintGuessMarkers().
        // Rebuilt fresh on every call (another guess, the final reveal,
        // or a mid-round restore), and cleared in startGame() below when
        // a new round begins.
        var guessMarkers = [];

        function clearGuessMarkers() {
          guessMarkers.forEach(function (marker) { map.removeLayer(marker); });
          guessMarkers = [];
        }

        // The map starts fully locked (see the interaction handlers all
        // set to false above) so the puzzle can't be panned/zoomed away
        // from while playing. Once a round ends there's nothing left to
        // give away, so this turns dragging/zoom back on and adds the
        // zoom control, letting the player explore the revealed area.
        var zoomControl = null;

        function setMapInteractive(interactive) {
          [map.dragging, map.touchZoom, map.scrollWheelZoom, map.doubleClickZoom, map.boxZoom, map.keyboard].forEach(function (handler) {
            if (!handler) return;
            if (interactive) handler.enable(); else handler.disable();
          });

          if (interactive && !zoomControl) {
            zoomControl = L.control.zoom().addTo(map);
          } else if (!interactive && zoomControl) {
            map.removeControl(zoomControl);
            zoomControl = null;
          }
        }

        // --- game state ---
        var debugDate = null;
        var state = null;
        var pendingGameSetup = null;

        // Remembered across mode-modal choices this session (and used to
        // pick a mode without asking again under ?debug=true - see
        // startGame() below) - defaults to 'hard' since that's the
        // locked-map behavior that existed before this split, not
        // Metrordle's own 'normal' default (there, normal was always the
        // pre-existing behavior instead).
        var lastPickedMode = 'hard';

        function startGame() {
          var dateKey = MetroShared.getDateKey(MetroShared.getEffectiveToday(debugDate));
          var gameNumber = MetroShared.getGameNumberForDateKey(dateKey, START_DATE_KEY);
          var target = pickTarget(dateKey, gameNumber);
          var saved = loadSavedState(dateKey);

          pendingGameSetup = { dateKey: dateKey, gameNumber: gameNumber, target: target, saved: saved };

          if (saved) {
            // Already playing/played today (in whichever mode that was) -
            // resume as-is, no choice to make.
            finishStartingGame(saved.mode);
          } else if (MetroShared.isDebugMode()) {
            // The date-nav buttons call startGame() on every click; showing
            // the modal for each fake "fresh day" would make date-browsing
            // unusable, so debug mode skips it and reuses whatever mode was
            // last picked (via the modal or the debug mode-toggle buttons).
            finishStartingGame(lastPickedMode);
          } else {
            $('mode-modal').hidden = false;
          }
        }

        function resolveModeChoice(mode) {
          lastPickedMode = mode;
          $('mode-modal').hidden = true;
          finishStartingGame(mode);
        }

        function finishStartingGame(mode) {
          // A maximized map from a previous round (or a previous day,
          // via debug date-nav) shouldn't carry over into this one.
          // The button itself (unlike the maximized state) is always
          // shown now, not just once a round ends - see
          // recenterMapOnTarget()'s own comment for why that's safe
          // even mid-round, now that the live marker is always visible
          // from the very first guess.
          setMapMaximized(false);
          $('map-maximize-btn').hidden = false;

          var dateKey = pendingGameSetup.dateKey;
          var gameNumber = pendingGameSetup.gameNumber;
          var target = pendingGameSetup.target;
          var saved = pendingGameSetup.saved;

          // Only load the streak on a done-day restore - a fresh/
          // in-progress round hasn't affected it yet, and endGame()
          // computes it fresh (via updateStreakForResult()) the moment
          // this round actually ends, same as Metrordle/Laberinto/
          // Memoria's own identical pattern.
          var savedStreak = (saved && saved.done) ? MetroShared.loadStreak(STREAK_STORAGE_KEY) : null;

          state = {
            dateKey: dateKey,
            gameNumber: gameNumber,
            target: target,
            attempts: (saved ? saved.guesses.length : 0) + (saved ? saved.hintsUsed : 0),
            guesses: saved ? saved.guesses : [],
            hintsUsed: saved ? saved.hintsUsed : 0,
            timeline: saved ? saved.timeline : [],
            done: saved ? !!saved.done : false,
            won: false,
            streak: savedStreak ? savedStreak.count : 0,
            maxStreak: savedStreak ? savedStreak.max : 0,
            mode: mode,
            leaderboardSubmitted: saved ? saved.leaderboardSubmitted : false,
          };

          $('game-title').textContent = 'Metrordle: Metroguessr #' + gameNumber;
          renderDateDebugLabel();

          var pos = stationByName[target];
          targetMarker.setLatLng([pos.lat, pos.lng]);
          recenterMapOnTarget();

          $('history').innerHTML = '';
          state.guesses.forEach(appendHistoryChip);
          renderPips();
          renderHintButton();

          // A day already played is done for good - restore straight into
          // the reveal, same as every other game here, instead of letting
          // a reload hand out a second attempt.
          if (state.done) {
            state.won = state.guesses[state.guesses.length - 1].correct;
            // submitScore() itself checks state.leaderboardSubmitted and
            // no-ops if it's already true, so this is only ever a real
            // retry when an earlier attempt is known to have failed (or
            // never ran).
            submitScore();
            showReveal(state.won);
            return;
          }

          setLabelsVisible(false);
          // Hard mode keeps the map locked while playing, same as always;
          // normal mode leaves it free to pan/zoom from the start, same as
          // it already is once a round ends (see showReveal()).
          setMapInteractive(state.mode === 'normal');
          if (targetIconMarker) {
            map.removeLayer(targetIconMarker);
            targetIconMarker = null;
          }
          // Repaints from scratch for whichever guesses already happened
          // before a reload (a no-op clear+repaint-nothing for a brand
          // new round) - see paintGuessMarkers()'s own comment.
          paintGuessMarkers();
          if (!map.hasLayer(targetMarker)) targetMarker.addTo(map);
          var markerEl = targetMarker.getElement();
          if (markerEl) markerEl.classList.add('target-marker--live');
          // Idempotent - resets any line-reveal leftovers from whatever
          // the previous round left this same marker/hintLineMarker as,
          // then reapplies for THIS round's own state.hintsUsed (0 for a
          // brand new round, restored back on for an in-progress reload).
          applyHintEffects();

          $('reveal').hidden = true;
          $('history-scroll').hidden = false;
          $('guess-form').hidden = false;
          $('status-line').hidden = false;
          $('guess-input').disabled = false;
          $('guess-input').value = '';
          $('guess-btn').disabled = true;

          if (state.attempts === 0) {
            $('status-line').textContent = 'Tienes ' + MAX_ATTEMPTS + ' intentos.';
          } else {
            var left = MAX_ATTEMPTS - state.attempts;
            $('status-line').textContent = left + ' intento' + (left === 1 ? '' : 's') + ' restante' + (left === 1 ? '' : 's') + '.';
          }
        }

        function renderPips() {
          var wrap = $('pips');
          wrap.innerHTML = '';
          // A hint burns an attempt without pushing to state.guesses, so
          // pip index i no longer lines up with state.guesses[i] once any
          // hint has been used - state.guesses[i] would either be the
          // wrong guess for that pip or (once hints outnumber guesses at
          // that point) undefined outright. A correct guess always ends
          // the round immediately, though, so the winning action (if any)
          // is always the LAST one taken overall, i.e. always at pip
          // index state.attempts - 1 - checked here against the last
          // entry in state.guesses rather than any per-index lookup.
          // This also has to work before state.won is actually set: this
          // runs during a done-state restore in finishStartingGame()
          // BEFORE that assignment happens, so it can't rely on it either.
          var lastGuess = state.guesses.length > 0 ? state.guesses[state.guesses.length - 1] : null;
          var winPipIndex = (state.done && lastGuess && lastGuess.correct) ? state.attempts - 1 : -1;
          for (var i = 0; i < MAX_ATTEMPTS; i++) {
            var span = document.createElement('span');
            var used = i < state.attempts;
            span.className = 'pip' + (used ? (i === winPipIndex ? ' pip--win' : ' pip--used') : '');
            wrap.appendChild(span);
          }
        }

        // Shared by the history chips and the map pins (see
        // paintGuessMarkers()) - both shown live as each guess happens
        // now, just two different places to display the same
        // distance/direction hint.
        function formatGuessHint(guess) {
          return {
            distText: guess.correct ? '0 km' : guess.dist.toFixed(guess.dist < 10 ? 1 : 0) + ' km',
            arrow: guess.correct ? '🎯' : bearingArrow(stationByName[guess.name], stationByName[state.target]),
          };
        }

        function appendHistoryChip(guess) {
          var hint = formatGuessHint(guess);
          var chip = document.createElement('span');
          chip.className = 'history-chip';
          chip.title = guess.name;
          chip.setAttribute('aria-label', guess.name + ': ' + hint.distText);
          chip.innerHTML =
            '<span class="history-chip__dist">' + hint.distText + '</span>' +
            '<span class="history-chip__dir">' + hint.arrow + '</span>';
          $('history').appendChild(chip);
        }

        function submitGuess(name) {
          if (!state || state.done || !stationByName[name]) return;
          var guessPos = stationByName[name];
          var targetPos = stationByName[state.target];
          // See haversineKm()'s own logging for the raw math - this
          // one ties that back to the station NAMES involved, since
          // haversineKm only ever sees plain {lat, lng} points.
          console.log('[Distance] guess "' + name + '" ' + JSON.stringify(guessPos) +
            ' vs target "' + state.target + '" ' + JSON.stringify(targetPos));
          var dist = haversineKm(guessPos, targetPos);
          var correct = name === state.target;

          state.attempts++;
          var guess = { name: name, dist: dist, correct: correct };
          state.guesses.push(guess);
          state.timeline.push({ kind: 'guess' });
          appendHistoryChip(guess);

          renderPips();

          if (correct || state.attempts >= MAX_ATTEMPTS) {
            // endGame() -> showReveal() already recenters once the
            // round's own layout (guess-form hidden, reveal shown)
            // settles - recentering again here first, against the
            // about-to-be-replaced mid-round layout, would just be
            // immediately redone.
            endGame(correct);
          } else {
            var left = MAX_ATTEMPTS - state.attempts;
            $('status-line').textContent = left + ' intento' + (left === 1 ? '' : 's') + ' restante' + (left === 1 ? '' : 's') + '.';
            // A wrong guess gets its own map pin right away now, not
            // just once the round ends - endGame() -> showReveal()
            // paints the final set itself (this guess included) on the
            // ending path, so this only needs to run here when the
            // round is actually still going.
            paintGuessMarkers();
            // Each guess adds a history chip (see appendHistoryChip()
            // above) - on a narrow viewport those can wrap onto a new
            // line, growing .panel tall enough to push the live target
            // marker out from under it, same risk the reveal screen's
            // own leaderboard already had (see recenterMapOnTarget()'s
            // own comment).
            recenterMapOnTarget();
          }
          renderHintButton();

          persistState();

          $('guess-input').value = '';
          $('guess-btn').disabled = true;
          hideSuggestions();
        }

        function endGame(won) {
          state.done = true;
          state.won = won;
          state.streak = MetroShared.updateStreakForResult(STREAK_STORAGE_KEY, state.dateKey, won);
          state.maxStreak = MetroShared.loadStreak(STREAK_STORAGE_KEY).max;
          state.leaderboardSubmitted = false;
          submitScore();
          showReveal(won);
        }

        // Unlocked only after the first guess (there's nothing to reveal
        // yet before then), and only up to two uses - one to reveal the
        // target's line, one more to reveal street names. Each use burns
        // one of the round's 5 attempt slots exactly like a wrong guess
        // does, but WITHOUT pushing a fake entry into state.guesses (a
        // hint has no station name/distance of its own, and would
        // otherwise show up as a bogus history chip/map pin) - so
        // state.attempts and state.guesses.length can diverge from here
        // on, tracked apart via state.hintsUsed. See renderPips()'s own
        // comment for how the pip rendering stays correct once that's
        // true.
        function useHint() {
          if (!state || state.done || state.guesses.length === 0 || state.hintsUsed >= 2) return;
          state.hintsUsed++;
          state.attempts++;
          state.timeline.push({ kind: 'hint' });
          applyHintEffects();
          renderPips();

          if (state.attempts >= MAX_ATTEMPTS) {
            endGame(false);
          } else {
            var left = MAX_ATTEMPTS - state.attempts;
            $('status-line').textContent = left + ' intento' + (left === 1 ? '' : 's') + ' restante' + (left === 1 ? '' : 's') + '.';
          }
          renderHintButton();

          persistState();
        }

        // Idempotent and safe to call any number of times - always
        // resets to baseline first (no recolor, no badge), then
        // reapplies whatever state.hintsUsed calls for right now. Called
        // both right after a live useHint() and again during
        // finishStartingGame()'s restore path for a resumed round (0
        // hints on a brand new one, back on for an in-progress reload) -
        // resetting unconditionally first is what makes it safe to reuse
        // across a debug date-nav jump between two different days too,
        // without needing a separate manual cleanup step at each call
        // site.
        function applyHintEffects() {
          var markerEl = targetMarker.getElement();
          if (markerEl) markerEl.classList.remove('target-marker--line-revealed');
          if (hintLineMarker) {
            map.removeLayer(hintLineMarker);
            hintLineMarker = null;
          }

          if (!state || state.hintsUsed === 0) return;

          var line = lineForStation(state.target);
          if (line && markerEl) {
            markerEl.style.setProperty('--reveal-line-color', line.color);
            markerEl.classList.add('target-marker--line-revealed');
          }
          if (line) {
            // A separate small badge marker, pinned right on top of the
            // live circle, rather than text elsewhere on the page -
            // naming the line's number right where the target already
            // is reads faster than a sentence, and doesn't need its own
            // aria-live line since it's just as discoverable as the
            // marker itself already was.
            var pos = stationByName[state.target];
            hintLineMarker = L.marker([pos.lat, pos.lng], {
              icon: L.divIcon({ className: 'hint-line-badge', iconSize: [30, 30], iconAnchor: [15, 15] }),
              interactive: false,
            }).addTo(map);
            var badgeEl = hintLineMarker.getElement();
            if (badgeEl) {
              badgeEl.style.setProperty('--badge-bg', line.color);
              badgeEl.style.setProperty('--badge-ink', line.textColor);
              badgeEl.textContent = line.id;
            }
          }

          if (state.hintsUsed >= 2) setLabelsVisible(true);
        }

        function renderHintButton() {
          var btn = $('hint-btn');
          if (!state || state.done || state.guesses.length === 0 || state.hintsUsed >= 2) {
            btn.hidden = true;
            return;
          }
          btn.hidden = false;
          btn.textContent = state.hintsUsed === 0
            ? '🪄 Revelar línea (-1 intento)'
            : '🪄 Revelar calles (-1 intento)';
        }

        // Only worth mentioning when it's actually ahead of today's
        // streak - if today's result just set the record, it's already
        // the number shown right before this, and repeating it back
        // reads as redundant rather than as new information. Same
        // helper as Metrordle/Laberinto/Memoria's own identical one.
        function maxStreakLine(separator) {
          if (state.maxStreak <= state.streak) return '';
          return separator + MetroShared.formatMaxStreak(state.maxStreak);
        }

        function showReveal(won) {
          if (map.hasLayer(targetMarker)) map.removeLayer(targetMarker);
          if (targetIconMarker) map.removeLayer(targetIconMarker);
          if (hintLineMarker) {
            map.removeLayer(hintLineMarker);
            hintLineMarker = null;
          }

          var pos = stationByName[state.target];
          var line = lineForStation(state.target);
          targetIconMarker = L.marker([pos.lat, pos.lng], {
            icon: L.divIcon({ className: 'station target-icon-marker', iconSize: [34, 34], iconAnchor: [17, 17] }),
            interactive: false,
          }).addTo(map);
          var iconEl = targetIconMarker.getElement();
          if (iconEl) {
            if (line) {
              iconEl.style.setProperty('--badge-bg', line.color);
              iconEl.style.setProperty('--badge-ink', line.textColor);
            }
            var svg = buildStationIconEl(state.target);
            if (svg) {
              var iconWrap = document.createElement('span');
              iconWrap.className = 'station__icon';
              iconWrap.appendChild(svg);
              iconEl.appendChild(iconWrap);
            }
          }

          setLabelsVisible(true);
          setMapInteractive(true);
          $('guess-form').hidden = true;
          $('guess-input').disabled = true;
          $('guess-btn').disabled = true;
          // Emptied AND hidden - an empty status line still holds its own
          // min-height plus the panel's row gap, which read as a big dead
          // margin above the reveal banner. Hidden, the banner sits right
          // under the sheet's own top padding instead.
          $('status-line').textContent = '';
          $('status-line').hidden = true;
          // The same distance/direction hints are already pinned on the
          // map itself too by now (see paintGuessMarkers() below, each
          // one live since the guess that made it) - hiding the history
          // row here instead of just leaving it shrinks the bottom
          // sheet, freeing up vertical space for the now-unlocked map
          // (see recenterMapOnTarget() below, which relies on this
          // being hidden first to measure the sheet's new height).
          $('history-scroll').hidden = true;
          paintGuessMarkers();

          var reveal = $('reveal');
          reveal.hidden = false;
          // On a win the player just guessed the station themselves - no
          // need to repeat it back. Only a loss names it.
          var streakLine = '🔥 ' + MetroShared.formatStreak(state.streak) + maxStreakLine(', ') + '.';
          MetroShared.renderNoticeBanner(
            $('reveal-banner'),
            won ? 'notice--success' : 'notice--error',
            won ? '¡Correcto!' : 'Se acabaron los intentos',
            won ? streakLine : streakLine + ' La estación era: ' + state.target + '.'
          );

          renderAliasRow();
          renderLeaderboard();
          recenterMapOnTarget();
          renderGamePromo('metroguessr');
        }

        // Mounts the end screen's "sigue jugando hoy" component into this
        // page's own slot - shared.js only builds the component itself
        // (MetroShared.buildGamePromo), it never reaches into this
        // page's DOM. Uses the real calendar day, not this page's own
        // (possibly debug-simulated) dateKey - suggestions reflect
        // actual daily activity, not whatever day is being previewed.
        function renderGamePromo(currentGameKey) {
          var slot = $('game-promo-slot');
          if (!slot) return;
          var todayKey = MetroShared.getDateKey(new Date());
          var promo = MetroShared.buildGamePromo(currentGameKey, todayKey);
          slot.innerHTML = '';
          if (promo) slot.appendChild(promo);
        }

        // One pin per unique WRONG guess, placed at that guess's own
        // station, right after the guess that made it (not just once
        // the round ends) - the correct guess (if any) is already
        // marked by targetIconMarker at that same spot, so it's skipped
        // here. Guessing the same wrong station more than once (allowed,
        // if unlikely) collapses to a single pin rather than stacking
        // duplicates on top of each other. Clears and repaints from
        // state.guesses in full on every call rather than adding just
        // the newest one, so it's safe to call repeatedly (after every
        // guess, and again on a mid-round restore for whichever guesses
        // already happened before the reload) without worrying about
        // what was already on the map from an earlier call.
        function paintGuessMarkers() {
          clearGuessMarkers();
          var seen = {};
          state.guesses.forEach(function (guess) {
            if (guess.correct || seen[guess.name]) return;
            seen[guess.name] = true;

            var guessPos = stationByName[guess.name];
            var hint = formatGuessHint(guess);
            var marker = L.marker([guessPos.lat, guessPos.lng], {
              icon: L.divIcon({
                className: 'guess-marker',
                iconSize: null,
                html:
                  '<span class="guess-marker__pill">' +
                  '<span class="guess-marker__dist">' + hint.distText + '</span>' +
                  '<span class="guess-marker__dir">' + hint.arrow + '</span>' +
                  '</span>',
              }),
              interactive: false,
            }).addTo(map);
            guessMarkers.push(marker);
          });
        }

        // The target's own live marker is visible on the map from the
        // very first guess (that's the puzzle - matching the pinned
        // location to its real station name, see AGENTS.md), not just
        // once the round ends, so it's always worth keeping it clear of
        // whatever's currently covering the screen: the floating topbar
        // above, and the bottom sheet (.panel) below, whose own height
        // varies over the round's lifetime (a guess-form early on, a
        // growing history row as guesses mount up, then the reveal's
        // banner/leaderboard once it's over - see submitGuess(),
        // showReveal(), and recenterMapIfRevealed() below for the three
        // places that change). Centering in the FULL viewport (plain
        // map.setView()) would leave the target sitting off-center in
        // whatever band is actually left uncovered between those two -
        // panning by half the DIFFERENCE between the sheet's and the
        // topbar's own heights lands it in the middle of that band
        // instead, in whichever direction either one happens to be
        // taller right now. Also runs correctly (zero offset) while
        // .map-maximized hides .panel entirely (see setMapMaximized()
        // below) - a hidden element's own getBoundingClientRect() is
        // already all-zero, nothing extra to special-case here.
        function recenterMapOnTarget() {
          if (!state) return;
          var pos = stationByName[state.target];
          if (!pos) return;
          var panelHeight = document.querySelector('.panel').getBoundingClientRect().height;
          var topbarHeight = topbarEl.offsetHeight;
          map.setView([pos.lat, pos.lng], MAP_ZOOM, { animate: false });
          map.panBy([0, (panelHeight - topbarHeight) / 2], { animate: false });
        }

        // Purely a visibility toggle for .panel (see .map-maximize-btn's
        // own comment in <style>) - the map underneath never resizes,
        // so there's no container reflow to do. Does recenter on every
        // toggle (unlike a plain show/hide would need to) since hiding
        // or restoring .panel is exactly the kind of visible-area change
        // recenterMapOnTarget() above already knows how to correct for.
        // Reads .map-maximized off <body> itself (via
        // toggleMapMaximized()) rather than a separate JS flag, so
        // there's exactly one source of truth for the state.
        function setMapMaximized(maximized) {
          document.body.classList.toggle('map-maximized', maximized);
          var btn = $('map-maximize-btn');
          btn.textContent = maximized ? '✕' : '⛶';
          var label = maximized ? 'Minimizar mapa' : 'Ampliar mapa';
          btn.setAttribute('aria-label', label);
          btn.setAttribute('title', label);
          recenterMapOnTarget();
        }

        function toggleMapMaximized() {
          setMapMaximized(!document.body.classList.contains('map-maximized'));
        }

        // renderLeaderboard() loads its rows/status asynchronously, after
        // showReveal() already did an initial (necessarily approximate)
        // recenter - the sheet's height can shift once that content
        // lands (e.g. an empty "no scores yet" line vs. a full top-5
        // list), so this re-runs the same recenter with the now-final
        // height. A no-op while still playing (recenterMapOnTarget()
        // itself is called separately, straight from submitGuess(), for
        // that case) - renderLeaderboard() is only ever invoked from
        // showReveal() to begin with, so state.done is already implied
        // here, but checking it explicitly keeps this safe to call on
        // its own regardless.
        function recenterMapIfRevealed() {
          if (state && state.done) recenterMapOnTarget();
        }

        // Submits the current result to today's leaderboard (win or loss -
        // a loss still has a meaningful attempts count, always
        // TOTAL_ATTEMPTS since that's the only way a round ends without a
        // correct guess; see the lost field below), if an alias is
        // already set. Laberinto's own leaderboard is unaffected by this -
        // a give-up there still has no meaningful route to rank, unlike a
        // loss here or on Metrordle's own board. Also called again once
        // the player sets an alias from the reveal screen, in case a
        // round already finished before they had one.
        //
        // hardMode is stored alongside attempts so the combined
        // leaderboard (one ranking, not split by mode) can rank a
        // hard-mode entry ahead of a normal-mode one at the same
        // attempts count - same convention as Metrordle's own hardMode
        // tiebreak.
        //
        // Skips entirely under ?debug=true - date-nav testing plays
        // through arbitrary past/future days and shouldn't pollute the
        // real leaderboard with them.
        function submitScore() {
          if (!state || !state.done) return;
          if (state.leaderboardSubmitted) return;
          if (MetroShared.isDebugMode()) return;

          var alias = MetroShared.getAlias();
          if (!alias) return;

          // state.attempts, not state.guesses.length - a hint burns an
          // attempt without adding a guess (see useHint()), and the
          // leaderboard should rank a hint-assisted win behind an
          // unassisted one at the same guess count, not hide the hints
          // used to get there. lost sorts a loss after every win (see
          // renderLeaderboard()'s orderBySpecs) and is what the
          // leaderboard row renders "-" for instead of a number - an
          // entry from before this feature has no such field at all,
          // which compareByOrderSpecs() treats as false (a win), exactly
          // right since every entry that predates this only ever
          // submitted on a win in the first place. hintsUsed/streak are
          // submitted too, purely for display (this page's own 🪄 badge,
          // /admin/'s own 🔥 one) - ranking itself only ever needs
          // attempts/lost/hardMode.
          var fields = { attempts: state.attempts, hardMode: state.mode === 'hard', lost: !state.won, hintsUsed: state.hintsUsed, streak: state.streak };
          MetroShared.submitLeaderboardScore(LEADERBOARD_COLLECTION, state.dateKey, alias, fields, {})
            .then(function () {
              state.leaderboardSubmitted = true;
              persistState();
              renderLeaderboard();
            })
            .catch(function (err) {
              // Best-effort - the player's own result is already saved
              // locally either way, so a failed submission isn't shown as
              // an error in the UI; it's silently retried the next time
              // submitScore() runs (e.g. the next reload).
              console.error('[Leaderboard] submitScore() failed:', err);
            });
        }

        // Two-state alias control: an input+save row when no alias is set
        // yet, or a plain display once one exists - built with DOM
        // methods and textContent throughout, never innerHTML with the
        // alias itself, since it's free text from anyone who's played,
        // not trusted data like a station name.
        // A win or a loss both have something to submit now (see
        // submitScore()), so the alias row always shows once the round is
        // over.
        function renderAliasRow() {
          var el = $('leaderboard-alias-row');
          el.hidden = false;
          var alias = MetroShared.getAlias();
          if (alias) {
            showAliasDisplay(alias);
          } else {
            showAliasInput();
          }
        }

        function showAliasDisplay(alias) {
          var el = $('leaderboard-alias-row');
          el.innerHTML = '';

          var label = document.createElement('span');
          label.textContent = 'Jugando como: ';
          var strong = document.createElement('strong');
          strong.textContent = alias;
          label.appendChild(strong);

          el.appendChild(label);
        }

        function showAliasInput() {
          var el = $('leaderboard-alias-row');
          el.innerHTML = '';

          var input = document.createElement('input');
          input.type = 'text';
          input.maxLength = 20;
          input.placeholder = 'Tu alias';
          input.setAttribute('aria-label', 'Tu alias para la tabla de posiciones');

          var saveBtn = document.createElement('button');
          saveBtn.type = 'button';
          saveBtn.className = 'btn-primary btn-primary--sm';
          saveBtn.textContent = 'Guardar';

          function save() {
            var normalized = MetroShared.setAlias(input.value);
            if (!normalized) return;
            showAliasDisplay(normalized);
            submitScore();
          }

          saveBtn.addEventListener('click', save);
          input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') save();
          });

          el.appendChild(input);
          el.appendChild(saveBtn);
        }

        // renderLeaderboard() can legitimately be called twice in close
        // succession - once from showReveal() showing the current state,
        // and again from submitScore()'s success callback refreshing it
        // with the just-submitted entry - and both are async. Without
        // this guard, an earlier call's response can resolve after a
        // later call already cleared and repainted the list, appending a
        // stale copy of the rows on top instead of being discarded.
        // Bumped on every call; a response only renders if it's still
        // the latest.
        var leaderboardRequestId = 0;

        function renderLeaderboard() {
          var dateKey = state.dateKey;
          var requestId = ++leaderboardRequestId;
          // Deliberately not clearing the list/status here - this call is
          // often just a same-data refresh (e.g. a reload of an
