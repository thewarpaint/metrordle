          // already-submitted day), and blanking the list before the
          // fetch resolves would cause a visible flicker.

          var myAliasId = MetroShared.aliasDocId(MetroShared.getAlias());

          // extraFields: hintsUsed is rendered below (the 🪄 badge) but
          // deliberately isn't part of orderBySpecs (see submitScore()'s
          // own comment) - without naming it here too,
          // getTopLeaderboardScores() would never actually copy it from
          // the Firestore document into the returned entry, and every
          // real entry's badge would silently stay wandless. lost asc
          // puts a loss after a win at the same attempts count (the only
          // way they can tie, since a loss's attempts is always
          // TOTAL_ATTEMPTS) - attempts asc alone already sorts every
          // other loss last, since a loss's attempts count is always the
          // max possible. myAliasId guarantees the player's own row is
          // somewhere in the result even if it's ranked below the top
          // LEADERBOARD_SIZE (see getTopLeaderboardScores()'s own
          // comment).
          MetroShared.getTopLeaderboardScores(LEADERBOARD_COLLECTION, dateKey, LEADERBOARD_SIZE, [['attempts', 'asc'], ['lost', 'asc'], ['hardMode', 'desc']], { extraFields: ['hintsUsed'], myAliasId: myAliasId })
            .then(function (entries) {
              // Either the player navigated to a different day (debug
              // date-nav) before this resolved, or a newer
              // renderLeaderboard() call has already superseded this one -
              // either way, don't paint a stale response over whatever's
              // showing now.
              if (!state || state.dateKey !== dateKey) return;
              if (requestId !== leaderboardRequestId) return;

              var list = $('leaderboard-list');
              var statusEl = $('leaderboard-status');
              list.innerHTML = '';

              if (entries.length === 0) {
                statusEl.textContent = 'Todavía no hay puntajes hoy. ¡Sé el primero!';
                statusEl.hidden = false;
                recenterMapIfRevealed();
                return;
              }

              statusEl.hidden = true;

              entries.forEach(function (entry, index) {
                var li = document.createElement('li');
                li.className = 'leaderboard__row' + (entry.id === myAliasId ? ' leaderboard__row--you' : '');

                var rank = document.createElement('span');
                rank.className = 'leaderboard__rank';
                rank.textContent = '#' + MetroShared.formatRank(entry, index);

                var name = document.createElement('span');
                name.className = 'leaderboard__alias-name';
                name.textContent = entry.alias;

                var score = document.createElement('span');
                score.className = 'leaderboard__score';

                var badge = document.createElement('span');
                badge.className = 'leaderboard__score-badge';
                // Wands before the brain - one 🪄 per hint used, then 🧠
                // (matches the share text's own "🧠 Modo difícil" wording,
                // see buildShareText()). entry.hintsUsed is submitted
                // purely for this display (see submitScore()), never
                // part of orderBySpecs, so an entry that predates it
                // just shows no wands rather than ranking any
                // differently.
                var badgeText = entry.hintsUsed ? '🪄'.repeat(entry.hintsUsed) : '';
                if (entry.hardMode) badgeText += '🧠';
                badge.textContent = badgeText;

                var number = document.createElement('span');
                number.className = 'leaderboard__score-number';
                // Bare digit, no "intento(s)" suffix - the rank/badge/
                // number layout already makes it obvious what this
                // number counts, same as Metrordle's own leaderboard. A
                // loss has no meaningful attempts count to show (it's
                // always TOTAL_ATTEMPTS, same for every loss) - a bare
                // "-" instead of the number is what actually
                // communicates that.
                number.textContent = entry.lost ? '-' : String(entry.attempts);

                score.appendChild(badge);
                score.appendChild(number);

                li.appendChild(rank);
                li.appendChild(name);
                li.appendChild(score);
                list.appendChild(li);
              });

              recenterMapIfRevealed();
            });
        }

        // Distance -> emoji square for the share text, closest to
        // farthest: an exact match is always the bullseye, then a
        // blue/green/yellow/orange/red scale by how close the guess was.
        function guessEmoji(guess) {
          if (guess.correct) return '🎯';
          if (guess.dist < 0.5) return '🟦';
          if (guess.dist < 1) return '🟩';
          if (guess.dist < 2.5) return '🟨';
          if (guess.dist < 5) return '🟧';
          return '🟥';
        }

        // Sub-km distances read as meters ("350m"), not a fiddly "0.35km" -
        // km otherwise, one decimal under 10 for a bit of precision without
        // implying false accuracy above it.
        function shareDistanceText(km) {
          if (km < 1) return Math.round(km * 1000) + 'm';
          return (km < 10 ? km.toFixed(1) : Math.round(km)) + 'km';
        }

        // One line per guess, closest to farthest: the square plus how far
        // off it was, or just the bullseye with no distance for the match.
        // How many attempts it took is already implied by the line count
        // (guess lines plus hint lines, together always equal to
        // state.attempts - see buildShareLines() below), so there's no
        // separate "solved in N/5" summary line.
        function shareLineFor(guess) {
          if (guess.correct) return '🎯';
          return guessEmoji(guess) + ': ' + shareDistanceText(guess.dist);
        }

        // Fixed order hints always unlock in (line, then streets) - a
        // hint has no station name/distance of its own (see
        // state.hintsUsed's own comment above useHint()), so this is
        // all a hint's own timeline entry (see state.timeline's own
        // comment near persistState()) needs to pick its line. Same 🪄
        // glyph as the hint button's own live label
        // (renderHintButton()) and the leaderboard's own 🪄-per-hint
        // badge, so the one emoji means the same thing everywhere this
        // game uses it.
        var HINT_SHARE_LINES = ['🪄 Pista: revelar línea', '🪄 Pista: revelar calles'];

        // Walks state.timeline (the actual chronological order guesses
        // and hints happened in, not just state.guesses followed by
        // however many hints were used) to build the share text's lines
        // in the order they really occurred, rather than always listing
        // every guess before every hint regardless of when a hint was
        // actually used.
        function buildShareLines() {
          var guessIndex = 0;
          var hintIndex = 0;
          return state.timeline.map(function (entry) {
            if (entry.kind === 'hint') return HINT_SHARE_LINES[hintIndex++];
            return shareLineFor(state.guesses[guessIndex++]);
          });
        }

        function buildShareText() {
          var lines = buildShareLines().join('\n');
          var hardModeLine = state.mode === 'hard' ? '🧠 Modo difícil\n' : '';

          return 'Metrordle: Metroguessr #' + state.gameNumber + '\n' + hardModeLine +
            lines + '\n\n🔥 ' + MetroShared.formatStreak(state.streak) + maxStreakLine(', ') + '\n\n' +
            SHARE_URL;
        }

        function shareResult() {
          MetroShared.shareOrCopyText(buildShareText(), $('share-btn'));
        }

        // --- search / autocomplete ---
        var input = $('guess-input');
        var suggestionsEl = $('suggestions');
        var guessBtn = $('guess-btn');
        var activeIndex = -1;
        var currentMatches = [];

        function hideSuggestions() {
          suggestionsEl.hidden = true;
          suggestionsEl.innerHTML = '';
          activeIndex = -1;
          currentMatches = [];
        }

        function renderSuggestions(matches) {
          currentMatches = matches;
          activeIndex = -1;
          suggestionsEl.innerHTML = '';
          if (!matches.length) { suggestionsEl.hidden = true; return; }
          matches.slice(0, 8).forEach(function (name) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'suggestion';
            btn.textContent = name;
            btn.addEventListener('mousedown', function (e) {
              e.preventDefault();
              selectStation(name);
            });
            suggestionsEl.appendChild(btn);
          });
          suggestionsEl.hidden = false;
        }

        function selectStation(name) {
          input.value = name;
          hideSuggestions();
          guessBtn.disabled = !stationByName[name];
        }

        input.addEventListener('input', function () {
          guessBtn.disabled = true;
          var q = stripAccents(input.value.trim());
          if (!q) { hideSuggestions(); return; }
          var matches = STATIONS
            .map(function (s) { return s[0]; })
            .filter(function (name) { return stripAccents(name).indexOf(q) !== -1; })
            .sort(function (a, b) {
              var ai = stripAccents(a).indexOf(q), bi = stripAccents(b).indexOf(q);
              if (ai !== bi) return ai - bi;
              return a.length - b.length;
            });
          renderSuggestions(matches);
          if (stationByName[input.value]) guessBtn.disabled = false;
        });

        input.addEventListener('keydown', function (e) {
          if (suggestionsEl.hidden) {
            if (e.key === 'Enter' && !guessBtn.disabled) submitGuess(input.value);
            return;
          }
          var items = suggestionsEl.querySelectorAll('.suggestion');
          if (e.key === 'ArrowDown') {
            e.preventDefault();
            activeIndex = Math.min(activeIndex + 1, items.length - 1);
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            activeIndex = Math.max(activeIndex - 1, 0);
          } else if (e.key === 'Enter') {
            e.preventDefault();
            if (activeIndex >= 0 && currentMatches[activeIndex]) {
              selectStation(currentMatches[activeIndex]);
            } else if (!guessBtn.disabled) {
              submitGuess(input.value);
            }
            return;
          } else if (e.key === 'Escape') {
            hideSuggestions();
            return;
          } else {
            return;
          }
          items.forEach(function (el, i) { el.classList.toggle('suggestion--active', i === activeIndex); });
        });

        document.addEventListener('click', function (e) {
          if (!e.target.closest('.search-box')) hideSuggestions();
        });

        guessBtn.addEventListener('click', function () {
          if (!guessBtn.disabled) submitGuess(input.value);
        });

        $('share-btn').addEventListener('click', shareResult);

        $('hint-btn').addEventListener('click', useHint);

        $('map-maximize-btn').addEventListener('click', toggleMapMaximized);

        $('mode-normal-btn').addEventListener('click', function () { resolveModeChoice('normal'); });
        $('mode-hard-btn').addEventListener('click', function () { resolveModeChoice('hard'); });

        // --- debug date-nav (?debug=true) ---
        function shiftDebugDate(deltaDays) {
          var next = new Date(MetroShared.getEffectiveToday(debugDate).getTime());
          next.setDate(next.getDate() + deltaDays);
          debugDate = next;
          startGame();
        }

        function renderDateDebugLabel() {
          var label = $('date-debug-label');
          if (!label) return;
          var dateKey = MetroShared.getDateKey(MetroShared.getEffectiveToday(debugDate));
          var isRealToday = dateKey === MetroShared.getDateKey(new Date());
          label.textContent = dateKey + (isRealToday ? ' (hoy)' : '');
        }

        if (MetroShared.isDebugMode()) {
          $('date-row').hidden = false;
          $('date-prev').addEventListener('click', function () { shiftDebugDate(-1); });
          $('date-next').addEventListener('click', function () { shiftDebugDate(1); });

          // The real modal never shows in debug mode (see startGame()),
          // so these are the only way to flip modes while browsing dates -
          // they re-render the *current* effective day, no date change.
          $('debug-mode-normal').addEventListener('click', function () {
            lastPickedMode = 'normal';
            finishStartingGame('normal');
          });
          $('debug-mode-hard').addEventListener('click', function () {
            lastPickedMode = 'hard';
            finishStartingGame('hard');
          });
        }

        startGame();
      })();
    </script>
  </body>
</html>
