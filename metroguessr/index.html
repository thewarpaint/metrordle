    <meta charset="utf-8">
    <!--
      Same defense-in-depth note as Memoria/Laberinto: Firestore-sourced
      leaderboard data (aliases) is always rendered via textContent, never
      innerHTML - see renderLeaderboard() below. On top of that baseline,
      this page also needs: cdnjs for Leaflet's and MapLibre GL's JS/CSS
      (script-src and style-src); cdn.jsdelivr.net for the small
      maplibre-gl-leaflet bridge script that lets a MapLibre vector layer
      sit inside the Leaflet map (script-src); and OpenFreeMap's tile
      host for the actual map data. Unlike CARTO's old raster tiles
      (plain <img> elements), MapLibre fetches vector tiles/style/glyphs/
      sprite via fetch()/XHR, so OpenFreeMap needs connect-src too, not
      just img-src (img-src covers a sprite-image fallback path).
      gstatic.com is also in connect-src, not just script-src - with
      DevTools' source maps enabled, the browser fetches the Firebase
      SDK's own *.js.map files from the same host as a plain connect-src
      load, same as any other fetch. And MapLibre parses vector tiles in
      a background Worker it constructs from a blob: URL - worker-src
      isn't covered by script-src's own blob:-less allowlist (there's no
      automatic fallback the other way), so it needs its own directive.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: https://tiles.openfreemap.org; font-src 'self' data:; connect-src 'self' https://tiles.openfreemap.org https://firestore.googleapis.com https://*.googleapis.com https://www.gstatic.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';">

    <style>
      html, body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        position: relative;
        background: var(--paper-well);
      }

      /* --- full-bleed map background --- */

      .map-stage {
        position: fixed;
        inset: 0;
        background: var(--paper-well);
      }

      /* Leaflet's own default CSS paints its container a fixed #ddd
         regardless of theme - this overrides it (an id selector already
         beats leaflet.css's .leaflet-container class) so the gap while
         tiles are still loading matches the page instead of flashing
         light gray/white in dark mode. */
      #leaflet-map {
        width: 100%;
        height: 100%;
        background: var(--paper-well);
      }

      .target-marker {
        stroke: #ffffff;
        stroke-width: 3;
        fill: #ffffff;
        fill-opacity: 0.22;
      }

      .target-marker--live { animation: pulse 1.8s ease-in-out infinite; }

      @keyframes pulse {
        0%, 100% { r: 11; stroke-opacity: 0.95; }
        50% { r: 17; stroke-opacity: 0.3; }
      }

      @media (prefers-reduced-motion: reduce) {
        .target-marker--live { animation: none; }
      }

      /* Reveal marker: the station's own pictogram (same style as
         Conexión's board tiles) on a badge colored with its Metro line,
         swapped in for the plain circle once the round ends. Passing our
         own `className` to L.divIcon() replaces Leaflet's default
         'leaflet-div-icon' class outright (rather than adding to it), so
         this only needs to target our own class, not that default one. */
      .target-icon-marker {
        background: var(--badge-bg, var(--ink));
        border: none;
        border-radius: 0 33% 0 0;
        box-shadow: 0 2px 10px var(--shadow), 0 0 0 2px var(--paper);
        color: var(--badge-ink, var(--paper));
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .target-icon-marker svg {
        display: block;
        width: 60%;
        height: 60%;
      }

      /* --- floating topbar --- */

      .topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 500;
        padding: max(0.85rem, env(safe-area-inset-top)) 1rem 0.6rem;
        background: color-mix(in srgb, var(--paper) 66%, transparent);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        border-bottom: 1px solid var(--rule);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.3rem;
      }

      h1 {
        font-family: 'Overpass', sans-serif;
        font-weight: 800;
        font-size: 1.25rem;
        letter-spacing: -0.01em;
        margin: 0;
        text-wrap: balance;
      }

      .date-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .date-row[hidden] { display: none; }

      .date-debug-label {
        color: var(--ink-soft);
        font-size: 0.78rem;
        font-variant-numeric: tabular-nums;
        min-width: 6rem;
        text-align: center;
      }

      .pips {
        display: flex;
        gap: 0.4rem;
        margin-top: 0.1rem;
      }

      .pip {
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 50%;
        background: var(--rule);
        transition: background 0.2s ease;
      }

      .pip--used { background: var(--danger); }
      .pip--win { background: var(--ok); }

      /* --- bottom sheet panel --- */

      .panel {
        position: fixed;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        width: 100%;
        max-width: 27rem;
        z-index: 500;
        max-height: 60vh;
        background: color-mix(in srgb, var(--paper-raised) 66%, transparent);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        border: 1px solid var(--rule);
        border-bottom: none;
        box-shadow: 0 -6px 24px var(--shadow);
        padding: 0.7rem 1.1rem calc(0.9rem + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
      }

      .guess-form {
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
        flex: none;
      }

      .guess-form[hidden] { display: none; }

      .search-box { position: relative; flex: none; }

      input[type="text"] {
        width: 100%;
        font-family: inherit;
        font-size: 0.95rem;
        font-weight: 500;
        color: var(--ink);
        background: var(--paper);
        border: 1.5px solid var(--rule);
        border-radius: 0 0.7rem 0 0.7rem;
        padding: 0.6rem 0.8rem;
      }

      input[type="text"]:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 1px;
      }

      input[type="text"]:disabled { opacity: 0.5; }

      .suggestions {
        position: absolute;
        bottom: calc(100% + 0.3rem);
        left: 0;
        right: 0;
        background: var(--paper-raised);
        border: 1px solid var(--rule);
        border-radius: 0.5rem;
        box-shadow: 0 -4px 14px var(--shadow);
        max-height: 11rem;
        overflow-y: auto;
        z-index: 5;
      }

      .suggestions[hidden] { display: none; }

      .suggestion {
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        font-family: inherit;
        font-size: 0.9rem;
        color: var(--ink);
        padding: 0.55rem 0.8rem;
        cursor: pointer;
      }

      .suggestion:not(:last-child) { border-bottom: 1px solid var(--rule); }
      .suggestion:hover, .suggestion--active { background: var(--paper-well); }

      .guess-btn {
        flex: none;
        width: 100%;
        font-family: inherit;
        font-weight: 800;
        font-size: 0.8rem;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        /* --ink/--paper already flip between the two themes, so this
           reads as a dark button with light text in light mode and a
           light button with dark text in dark mode, for free. */
        color: var(--paper);
        background: var(--ink);
        border: none;
        border-radius: 0 0.7rem 0 0.7rem;
        padding: 0.62rem;
        cursor: pointer;
      }

      .guess-btn:disabled { opacity: 0.4; cursor: default; }

      .status-line {
        flex: none;
        text-align: center;
        font-size: 0.82rem;
        color: var(--ink-soft);
        min-height: 1.1rem;
        margin: 0;
      }

      /* flex:1 1 auto + min-height:0 (rather than the flex:none every
         other child here uses) lets this shrink and scroll internally
         once the leaderboard makes it taller than the panel's own
         max-height, instead of pushing content off the bottom of the
         screen - .panel itself stays overflow:visible so the guess
         suggestions dropdown (only ever shown while this is hidden) isn't
         clipped by a scroll container. */
      .reveal {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
      }
      .reveal[hidden] { display: none; }

      .reveal__banner {
        font-family: 'Overpass', sans-serif;
        font-weight: 800;
        font-size: 1.2rem;
        margin: 0;
      }

      .reveal__banner--win { color: var(--ok); }
      .reveal__banner--lose { color: var(--danger); }

      .reveal__station { font-size: 1rem; font-weight: 700; margin: 0; }

      /* .leaderboard* styling itself lives in shared.css, common to every
         game with a leaderboard - these are just this page's own deltas,
         sized down a bit further to fit the compact bottom sheet, plus
         text-align:left since .reveal (its parent here) centers text. */
      .leaderboard {
        margin-bottom: 0.6rem;
        text-align: left;
      }

      .leaderboard__title { font-size: 0.85rem; margin: 0 0 0.4rem; }
      .leaderboard__alias { font-size: 0.82rem; margin-bottom: 0.5rem; }
      .leaderboard__list { margin: 0 0 0.5rem; }
      .leaderboard__row { font-size: 0.82rem; padding: 0.35rem 0.55rem; }
      .leaderboard__status { font-size: 0.8rem; margin: 0 0 0.5rem; }

      .history-scroll { flex: none; max-height: 4.6rem; overflow-y: auto; }
      .history { display: flex; flex-wrap: wrap; gap: 0.4rem; }

      /* Station name is dropped from the compact chip (available via the
         title attribute on hover/long-press) - with only 5 attempts,
         distance + direction is enough to scan at a glance. */
      .history-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        padding: 0.3rem 0.55rem;
        background: var(--paper-well);
        border-radius: 999px;
        font-size: 0.78rem;
        font-weight: 700;
        white-space: nowrap;
      }

      .history-chip__dist { font-variant-numeric: tabular-nums; }
      .history-chip__dir { font-size: 0.95rem; line-height: 1; }

      /* Leaflet's own controls, restyled minimally to sit on our paper theme */
      .leaflet-control-attribution {
        background: color-mix(in srgb, var(--paper-well) 80%, transparent) !important;
        color: var(--ink-soft) !important;
        font-family: 'Overpass', sans-serif !important;
        font-size: 0.62rem !important;
      }

      .leaflet-control-attribution a { color: var(--ink-soft) !important; }

      .leaflet-control-zoom a {
        background: var(--paper-raised) !important;
        color: var(--ink) !important;
        border-color: var(--rule) !important;
      }

      .leaflet-control-zoom a:hover { background: var(--paper-well) !important; }

      /* The zoom control (top-left by default) would otherwise render
         right under the fixed topbar, which sits in its own stacking
         context above the map and so visually covers it. --topbar-h is
         kept in sync with the topbar's actual rendered height (it varies
         with the debug date-row) via a ResizeObserver below. */
      .leaflet-top { margin-top: calc(var(--topbar-h, 4.5rem) + 0.6rem); }
    </style>
  </head>

    <div class="map-stage">

    </div>

    <div class="topbar">
      <h1 id="game-title">Metrordle: Metroguessr</h1>

        <span class="date-debug-label" id="date-debug-label"></span>
        <button type="button" class="chev chev--compact" id="date-next" aria-label="Día siguiente">▶</button>
      </div>
      <div class="pips" id="pips"></div>
    </div>

    <div class="panel">
      <div class="guess-form" id="guess-form">
        <div class="search-box">
          <input type="text" id="guess-input" autocomplete="off" aria-label="¿Qué estación es?" placeholder="Escribe el nombre de una estación&hellip;">

        </div>
        <button class="guess-btn" id="guess-btn" disabled>Adivinar</button>
      </div>

      <p class="status-line" id="status-line"></p>

      <div class="reveal" id="reveal" hidden>
        <p class="reveal__banner" id="reveal-banner"></p>
        <p class="reveal__station" id="reveal-station"></p>

        <div class="leaderboard" id="leaderboard">
          <h2 class="leaderboard__title">Mejores 5 puntajes hoy</h2>
          <div class="leaderboard__alias" id="leaderboard-alias-row"></div>
          <ol class="leaderboard__list" id="leaderboard-list"></ol>
          <p class="leaderboard__status" id="leaderboard-status" hidden></p>
        </div>

        <button type="button" class="btn-secondary" id="share-btn">Compartir</button>
      </div>

      <div class="history-scroll">
        <div class="history" id="history"></div>
      </div>
    </div>

          ["San Pedro de los Pinos", 19.3913, -99.186096],
          ["Santa Anita", 19.4027, -99.121696],
          ["Santa Marta", 19.3603, -98.995102],
          ["Sevilla", 19.4219, -99.170601],
          ["Tacuba", 19.459499, -99.188698],
          ["Tacubaya", 19.4032, -99.187103],
          ["Talismán", 19.4746, -99.108002],
          ["Tasqueña", 19.3442, -99.142502],
          ["Tepalcates", 19.3913, -99.046402],
          ["Tepito", 19.442801, -99.123703],
          ["Terminal Aérea", 19.4338, -99.0877],
          ["Tezozómoc", 19.494699, -99.19559],
          ["Tlatelolco", 19.455218, -99.143164],
          ["UAM Azcapotzalco", 19.490999, -99.186401],
          ["UAM-I", 19.3508, -99.074699],
          ["Universidad", 19.324499, -99.174004],
          ["Valle Gómez", 19.4594, -99.119499],
          ["Vallejo", 19.490299, -99.155602],
          ["Velódromo", 19.4086, -99.102997],
          ["Viaducto", 19.4009, -99.136902],
          ["Villa de Aragón", 19.4617, -99.061302],
          ["Villa de Cortés", 19.3876, -99.139],
          ["Viveros", 19.353701, -99.176003],
          ["Xola", 19.395201, -99.137802],
          ["Zapata", 19.370701, -99.164902],
          ["Zaragoza", 19.4123, -99.082397],
          ["Zócalo", 19.433001, -99.1325]
        ];

        var START_DATE_KEY = '2026-09-12';
        var MAX_ATTEMPTS = 5;
        var MAP_ZOOM = 15;
        // OpenFreeMap's vector styles - no API key, no request cap, free
        // for good (donation-funded), unlike the CARTO raster tiles this
        // replaced. Loaded via the maplibre-gl-leaflet bridge (see
        // setTileLayer() below) so the rest of this file keeps using
        // Leaflet's own marker/interactivity API untouched - only the
        // tile engine underneath changed. Each style already has its own
        // light/dark variant; unlike CARTO, there's no separate
        // "no labels" style, so applyLabelVisibility() below hides/shows
        // every label (symbol-type) layer directly instead of swapping
        // URLs.
        var MAPLIBRE_STYLES = {
          light: 'https://tiles.openfreemap.org/styles/positron',
          dark: 'https://tiles.openfreemap.org/styles/dark',
        };
        var TILE_ATTRIBUTION = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, tiles by <a href="https://openfreemap.org">OpenFreeMap</a>';
        var SHARE_URL = 'https://metrordle.com/metroguessr/';
        var LEADERBOARD_COLLECTION = 'metroguessr-leaderboard';
        var LEADERBOARD_SIZE = 5;

        function $(id) { return document.getElementById(id); }

        function storageKeyFor(dateKey) {
          return 'metroguessr:' + dateKey;
        }

        // The target itself isn't stored - it's re-derived from dateKey
        // via the same seeded pick every load, same as every other game
        // here. Only the player's own guesses (and whether the round is
        // over) are session state worth persisting.
        function loadSavedState(dateKey) {
          try {
            var raw = localStorage.getItem(storageKeyFor(dateKey));
            if (!raw) return null;
            var parsed = JSON.parse(raw);
            if (!parsed || !Array.isArray(parsed.guesses)) return null;
            // leaderboardSubmitted was added after this key's format
            // shipped, so a result saved by an older version won't have
            // it - falling back to false just means one harmless
            // retry-submit next load, same as a genuine earlier failure
            // would cause (see submitScore()).
            return {
              guesses: parsed.guesses,
              done: !!parsed.done,
              leaderboardSubmitted: !!parsed.leaderboardSubmitted,
            };
          } catch (e) {
            return null;
          }
        }

        function persistState() {
          try {
            localStorage.setItem(storageKeyFor(state.dateKey), JSON.stringify({
              guesses: state.guesses,
              done: state.done,
              leaderboardSubmitted: state.leaderboardSubmitted,
            }));
          } catch (e) {
            // localStorage unavailable (private mode, quota, etc.) - the
            // game stays playable for this session, it just won't persist.
          }
        }

        function stripAccents(s) {
          return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        }

        // Great-circle distance between two lat/lng points, in km, via the
        // Haversine formula. Treats Earth as a sphere of radius R = 6371 km
        // (its mean radius) rather than the true oblate spheroid - the
        // resulting error is a fraction of a percent, which is irrelevant
        // at the city scale this game deals in (a few dozen km at most).
        //
        // Derivation: for two points with latitude/longitude differences
        // dLat/dLng (in radians), the haversine of the central angle
        // between them is
        //   hav(angle) = sin²(dLat/2) + cos(lat1)·cos(lat2)·sin²(dLng/2)
        // `h` below computes exactly that. Taking asin(sqrt(h)) recovers
        // half the central angle, so doubling it and multiplying by R
        // converts the angle into an arc length along the sphere's surface.
        function haversineKm(a, b) {
          var R = 6371;
          var dLat = (b.lat - a.lat) * Math.PI / 180;
          var dLng = (b.lng - a.lng) * Math.PI / 180;
          var lat1 = a.lat * Math.PI / 180, lat2 = b.lat * Math.PI / 180;
          var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
          return 2 * R * Math.asin(Math.sqrt(h));
        }

        // Initial compass bearing from `from` to `to`, collapsed to one of
        // 8 arrow glyphs (N/NE/E/SE/S/SW/W/NW), for the "which way was I
        // off" hint shown after a wrong guess.
        //
        // The bearing formula below is the standard spherical-trigonometry
        // one for initial bearing on a great-circle path:
        //   y = sin(dLng)·cos(lat2)
        //   x = cos(lat1)·sin(lat2) - sin(lat1)·cos(lat2)·cos(dLng)
        //   bearing = atan2(y, x)
        // atan2 returns radians in (-180°, 180°], measured clockwise from
        // north but negative to the west of it; `+ 360) % 360` shifts that
        // into the usual 0-360° compass range. Dividing by 45° and rounding
        // then buckets the bearing into one of 8 equal 45°-wide octants
        // (e.g. anything from 337.5° to 22.5° rounds to octant 0, "north"),
        // and `% 8` wraps the one case (exactly 360°) that would otherwise
        // round up past the last index back to octant 0.
        function bearingArrow(from, to) {
          var lat1 = from.lat * Math.PI / 180, lat2 = to.lat * Math.PI / 180;
          var dLng = (to.lng - from.lng) * Math.PI / 180;
          var y = Math.sin(dLng) * Math.cos(lat2);
          var x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLng);
          var deg = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
          var arrows = ['↑', '↗', '→', '↘', '↓', '↙', '←', '↖'];
          return arrows[Math.round(deg / 45) % 8];
        }

        var stationByName = {};
        STATIONS.forEach(function (s) { stationByName[s[0]] = { lat: s[1], lng: s[2] }; });

        // A station on more than one line (an interchange) just takes the
        // first match in MetroShared.LINES's own order - there's no single
        // "correct" line to prefer for those, so this keeps it deterministic
        // rather than picking one some other way.
        function lineForStation(name) {
          for (var i = 0; i < MetroShared.LINES.length; i++) {
            if (MetroShared.LINES[i].stations.indexOf(name) !== -1) return MetroShared.LINES[i];
          }
          return null;
        }

        // Same pictogram-on-a-badge look as Conexión's board tiles: the
        // station's icon (from the shared /station-icons.svg sprite,
        // fill="currentColor" inside each <symbol>) on a circle colored
        // with its Metro line, icon tinted with the line's own text color.
        function buildStationIconEl(name) {
          var slug = MetroShared.STATION_ICON_SLUGS[name];
          if (!slug) return null;
          var svgNS = 'http://www.w3.org/2000/svg';
          var svg = document.createElementNS(svgNS, 'svg');
          svg.setAttribute('aria-hidden', 'true');
          var use = document.createElementNS(svgNS, 'use');
          use.setAttributeNS('http://www.w3.org/1999/xlink', 'href', '/station-icons.svg#' + slug);
          use.setAttribute('href', '/station-icons.svg#' + slug);
          svg.appendChild(use);
          return svg;
        }

        function prefersDark() {
          return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        }

        // Keeps --topbar-h (used to push the zoom control below the
        // topbar, see .leaflet-top) in sync with its actual rendered
        // height, which changes when the debug date-row shows/hides.
        var topbarEl = document.querySelector('.topbar');
        function syncTopbarHeight() {
          document.documentElement.style.setProperty('--topbar-h', topbarEl.offsetHeight + 'px');
        }
        syncTopbarHeight();
        if (window.ResizeObserver) {
          new ResizeObserver(syncTopbarHeight).observe(topbarEl);
        } else {
          window.addEventListener('resize', syncTopbarHeight);
        }

        var map = L.map('leaflet-map', {
          zoomControl: false,
          dragging: false,
          touchZoom: false,
          scrollWheelZoom: false,
          doubleClickZoom: false,
          boxZoom: false,
          keyboard: false,
          attributionControl: false,
        }).setView([19.4326, -99.1332], MAP_ZOOM);

        L.control.attribution({ prefix: false, position: 'bottomright' })
          .addAttribution(TILE_ATTRIBUTION)
          .addTo(map);

        var glLayer = null;
        var glStyleReady = false;
        var showLabels = false;

        // Every symbol-type layer in the current style is a label (place
        // names, road names, POI icons+text) - hiding all of them,
        // rather than hardcoding OpenFreeMap's own layer names, keeps
        // this working even if a future style revision renames or
        // reshuffles its layers. No-ops until glStyleReady is set (see
        // setTileLayer() below) - the pending listener there re-applies
        // this once the style actually is ready.
        function applyLabelVisibility() {
          if (!glLayer || !glStyleReady) return;
          var glMap = glLayer.getMaplibreMap();
          var visibility = showLabels ? 'visible' : 'none';
          glMap.getStyle().layers.forEach(function (layer) {
            if (layer.type === 'symbol') glMap.setLayoutProperty(layer.id, 'visibility', visibility);
          });
        }

        function setTileLayer() {
          if (glLayer) map.removeLayer(glLayer);
          glStyleReady = false;
          glLayer = L.maplibreGL({
            style: MAPLIBRE_STYLES[prefersDark() ? 'dark' : 'light'],
            attributionControl: false,
          }).addTo(map);

          // isStyleLoaded()/'styledata' (tried first) turned out to be
          // gated on the style's TILE data finishing too, not just the
          // style definition itself - under any kind of tile-loading
          // slowness (a flaky connection, or the worker-src CSP block
          // that briefly existed here) that condition could take a long
          // time to ever become true, leaving labels stuck visible the
          // whole time. MapLibre's own 'style.load' event would be the
          // clean fix but isn't available before v6 (this page pins
          // v5). The well-established, version-independent signal that
          // the style itself (not its tiles) is ready is the 'data'
          // event with dataType 'style' - it doesn't require removing
          // the listener defensively since it only ever needs to fire
          // once per style, handled here by unregistering as soon as it
          // does.
          var glMap = glLayer.getMaplibreMap();
          function onStyleData(e) {
            if (e.dataType !== 'style') return;
            glMap.off('data', onStyleData);
            glStyleReady = true;
            applyLabelVisibility();
          }
          glMap.on('data', onStyleData);
        }

        // Unlike CARTO's raster tiles (a genuinely different URL per
        // labels state, so toggling always meant a full reload), a
        // vector style can show/hide its own label layers in place -
        // this flips just those layers on the already-loaded style
        // instead of tearing down and refetching the whole map.
        function setLabelsVisible(visible) {
          showLabels = visible;
          applyLabelVisibility();
        }

        setTileLayer();

        if (window.matchMedia) {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', setTileLayer);
        }

        var targetMarker = L.circleMarker([19.4326, -99.1332], {
          radius: 11,
          className: 'target-marker',
          interactive: false,
        }).addTo(map);

        // The revealed station's icon badge, swapped in for targetMarker
        // once a round ends (built fresh each reveal since it depends on
        // that day's target/line).
        var targetIconMarker = null;

        // The map starts fully locked (see the interaction handlers all
        // set to false above) so the puzzle can't be panned/zoomed away
        // from while playing. Once a round ends there's nothing left to
        // give away, so this turns dragging/zoom back on and adds the
        // zoom control, letting the player explore the revealed area.
        var zoomControl = null;

        function setMapInteractive(interactive) {
          [map.dragging, map.touchZoom, map.scrollWheelZoom, map.doubleClickZoom, map.boxZoom, map.keyboard].forEach(function (handler) {
            if (!handler) return;
            if (interactive) handler.enable(); else handler.disable();
          });

          if (interactive && !zoomControl) {
            zoomControl = L.control.zoom().addTo(map);
          } else if (!interactive && zoomControl) {
            map.removeControl(zoomControl);
            zoomControl = null;
          }
        }

        // --- game state ---
        var debugDate = null;
        var state = null;

        function startGame() {
          var dateKey = MetroShared.getDateKey(MetroShared.getEffectiveToday(debugDate));
          var gameNumber = MetroShared.getGameNumberForDateKey(dateKey, START_DATE_KEY);
          var rand = MetroShared.createSeededRandom('metrordle-metroguessr-' + dateKey);
          var idx = Math.floor(rand() * STATIONS.length);
          var target = STATIONS[idx][0];
          var saved = loadSavedState(dateKey);

          state = {
            dateKey: dateKey,
            gameNumber: gameNumber,
            target: target,
            attempts: saved ? saved.guesses.length : 0,
            guesses: saved ? saved.guesses : [],
            done: saved ? !!saved.done : false,
            won: false,
            leaderboardSubmitted: saved ? saved.leaderboardSubmitted : false,
          };

          $('game-title').textContent = 'Metrordle: Metroguessr #' + gameNumber;
          renderDateDebugLabel();

          var pos = stationByName[target];
          map.setView([pos.lat, pos.lng], MAP_ZOOM, { animate: false });
          targetMarker.setLatLng([pos.lat, pos.lng]);

          $('history').innerHTML = '';
          state.guesses.forEach(appendHistoryChip);
          renderPips();

          // A day already played is done for good - restore straight into
          // the reveal, same as every other game here, instead of letting
          // a reload hand out a second attempt.
          if (state.done) {
            state.won = state.guesses[state.guesses.length - 1].correct;
            // submitScore() itself checks state.leaderboardSubmitted and
            // no-ops if it's already true, so this is only ever a real
            // retry when an earlier attempt is known to have failed (or
            // never ran).
            submitScore();
            showReveal(state.won);
            return;
          }

          setLabelsVisible(false);
          setMapInteractive(false);
          if (targetIconMarker) {
            map.removeLayer(targetIconMarker);
            targetIconMarker = null;
          }
          if (!map.hasLayer(targetMarker)) targetMarker.addTo(map);
          var markerEl = targetMarker.getElement();
          if (markerEl) markerEl.classList.add('target-marker--live');

          $('reveal').hidden = true;
          $('guess-form').hidden = false;
          $('guess-input').disabled = false;
          $('guess-input').value = '';
          $('guess-btn').disabled = true;

          if (state.attempts === 0) {
            $('status-line').textContent = 'Tienes ' + MAX_ATTEMPTS + ' intentos.';
          } else {
            var left = MAX_ATTEMPTS - state.attempts;
            $('status-line').textContent = left + ' intento' + (left === 1 ? '' : 's') + ' restante' + (left === 1 ? '' : 's') + '.';
          }
        }

        function renderPips() {
          var wrap = $('pips');
          wrap.innerHTML = '';
          for (var i = 0; i < MAX_ATTEMPTS; i++) {
            var span = document.createElement('span');
            span.className = 'pip' + (i < state.attempts ? (state.done && state.guesses[i].correct ? ' pip--win' : ' pip--used') : '');
            wrap.appendChild(span);
          }
        }

        function appendHistoryChip(guess) {
          var distText = guess.correct ? '0 km' : guess.dist.toFixed(guess.dist < 10 ? 1 : 0) + ' km';
          var arrow = guess.correct ? '🎯' : bearingArrow(stationByName[guess.name], stationByName[state.target]);
          var chip = document.createElement('span');
          chip.className = 'history-chip';
          chip.title = guess.name;
          chip.setAttribute('aria-label', guess.name + ': ' + distText);
          chip.innerHTML =
            '<span class="history-chip__dist">' + distText + '</span>' +
            '<span class="history-chip__dir">' + arrow + '</span>';
          $('history').appendChild(chip);
        }

        function submitGuess(name) {
          if (!state || state.done || !stationByName[name]) return;
          var guessPos = stationByName[name];
          var targetPos = stationByName[state.target];
          var dist = haversineKm(guessPos, targetPos);
          var correct = name === state.target;

          state.attempts++;
          var guess = { name: name, dist: dist, correct: correct };
          state.guesses.push(guess);
          appendHistoryChip(guess);

          renderPips();

          if (correct || state.attempts >= MAX_ATTEMPTS) {
            endGame(correct);
          } else {
            var left = MAX_ATTEMPTS - state.attempts;
            $('status-line').textContent = left + ' intento' + (left === 1 ? '' : 's') + ' restante' + (left === 1 ? '' : 's') + '.';
          }

          persistState();

          $('guess-input').value = '';
          $('guess-btn').disabled = true;
          hideSuggestions();
        }

        function endGame(won) {
          state.done = true;
          state.won = won;
          state.leaderboardSubmitted = false;
          submitScore();
          showReveal(won);
        }

        function showReveal(won) {
          if (map.hasLayer(targetMarker)) map.removeLayer(targetMarker);
          if (targetIconMarker) map.removeLayer(targetIconMarker);

          var pos = stationByName[state.target];
          var line = lineForStation(state.target);
          targetIconMarker = L.marker([pos.lat, pos.lng], {
            icon: L.divIcon({ className: 'target-icon-marker', iconSize: [34, 34], iconAnchor: [17, 17] }),
            interactive: false,
          }).addTo(map);
          var iconEl = targetIconMarker.getElement();
          if (iconEl) {
            if (line) {
              iconEl.style.setProperty('--badge-bg', line.color);
              iconEl.style.setProperty('--badge-ink', line.textColor);
            }
            var svg = buildStationIconEl(state.target);
            if (svg) iconEl.appendChild(svg);
          }

          setLabelsVisible(true);
          setMapInteractive(true);
          $('guess-form').hidden = true;
          $('guess-input').disabled = true;
          $('guess-btn').disabled = true;
          $('status-line').textContent = '';

          var reveal = $('reveal');
          reveal.hidden = false;
          var banner = $('reveal-banner');
          banner.textContent = won ? '¡Correcto!' : 'Se acabaron los intentos';
          banner.className = 'reveal__banner ' + (won ? 'reveal__banner--win' : 'reveal__banner--lose');
          $('reveal-station').textContent = 'La estación era: ' + state.target;

          renderAliasRow();
          renderLeaderboard();
        }

        // Submits the current result to today's leaderboard, if an alias
        // is already set. Only a win has a meaningful "attempts to solve"
        // to rank - a loss doesn't get an entry, same as Metrordle's and
        // Laberinto's own attempts-based leaderboards (unlike Memoria's
        // pairs-matched score, which is always comparable win or lose).
        // Also called again once the player sets an alias from the reveal
        // screen, in case a round already finished before they had one.
        //
        // Skips entirely under ?debug=true - date-nav testing plays
        // through arbitrary past/future days and shouldn't pollute the
        // real leaderboard with them.
        function submitScore() {
          if (!state || !state.done || !state.won) return;
          if (state.leaderboardSubmitted) return;
          if (MetroShared.isDebugMode()) return;

          var alias = MetroShared.getAlias();
          if (!alias) return;

          MetroShared.submitLeaderboardScore(LEADERBOARD_COLLECTION, state.dateKey, alias, { attempts: state.guesses.length }, {})
            .then(function () {
              state.leaderboardSubmitted = true;
              persistState();
              renderLeaderboard();
            })
            .catch(function (err) {
              // Best-effort - the player's own result is already saved
              // locally either way, so a failed submission isn't shown as
              // an error in the UI; it's silently retried the next time
              // submitScore() runs (e.g. the next reload).
              console.error('[Leaderboard] submitScore() failed:', err);
            });
        }

        // Two-state alias control: an input+save row when no alias is set
        // yet, or a plain display once one exists - built with DOM
        // methods and textContent throughout, never innerHTML with the
        // alias itself, since it's free text from anyone who's played,
        // not trusted data like a station name.
        function renderAliasRow() {
          var alias = MetroShared.getAlias();
          if (alias) {
            showAliasDisplay(alias);
          } else {
            showAliasInput();
          }
        }

        function showAliasDisplay(alias) {
          var el = $('leaderboard-alias-row');
          el.innerHTML = '';

          var label = document.createElement('span');
          label.textContent = 'Jugando como: ';
          var strong = document.createElement('strong');
          strong.textContent = alias;
          label.appendChild(strong);

          el.appendChild(label);
        }

        function showAliasInput() {
          var el = $('leaderboard-alias-row');
          el.innerHTML = '';

          var input = document.createElement('input');
          input.type = 'text';
          input.maxLength = 20;
          input.placeholder = 'Tu alias';
          input.setAttribute('aria-label', 'Tu alias para la tabla de posiciones');

          var saveBtn = document.createElement('button');
          saveBtn.type = 'button';
          saveBtn.className = 'btn-primary';
          saveBtn.textContent = 'Guardar';

          function save() {
            var normalized = MetroShared.setAlias(input.value);
            if (!normalized) return;
            showAliasDisplay(normalized);
            submitScore();
          }

          saveBtn.addEventListener('click', save);
          input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') save();
          });

          el.appendChild(input);
          el.appendChild(saveBtn);
        }

        // renderLeaderboard() can legitimately be called twice in close
        // succession - once from showReveal() showing the current state,
        // and again from submitScore()'s success callback refreshing it
        // with the just-submitted entry - and both are async. Without
        // this guard, an earlier call's response can resolve after a
        // later call already cleared and repainted the list, appending a
        // stale copy of the rows on top instead of being discarded.
        // Bumped on every call; a response only renders if it's still
        // the latest.
        var leaderboardRequestId = 0;

        function renderLeaderboard() {
          var dateKey = state.dateKey;
          var requestId = ++leaderboardRequestId;
          // Deliberately not clearing the list/status here - this call is
          // often just a same-data refresh (e.g. a reload of an
          // already-submitted day), and blanking the list before the
          // fetch resolves would cause a visible flicker.

          MetroShared.getTopLeaderboardScores(LEADERBOARD_COLLECTION, dateKey, LEADERBOARD_SIZE, [['attempts', 'asc']], {})
            .then(function (entries) {
              // Either the player navigated to a different day (debug
              // date-nav) before this resolved, or a newer
              // renderLeaderboard() call has already superseded this one -
              // either way, don't paint a stale response over whatever's
              // showing now.
              if (!state || state.dateKey !== dateKey) return;
              if (requestId !== leaderboardRequestId) return;

              var list = $('leaderboard-list');
              var statusEl = $('leaderboard-status');
              list.innerHTML = '';

              if (entries.length === 0) {
                statusEl.textContent = 'Todavía no hay puntajes hoy. ¡Sé el primero!';
                statusEl.hidden = false;
                return;
              }

              statusEl.hidden = true;

              var myAliasId = MetroShared.aliasDocId(MetroShared.getAlias());

              entries.forEach(function (entry, index) {
                var li = document.createElement('li');
                li.className = 'leaderboard__row' + (entry.id === myAliasId ? ' leaderboard__row--you' : '');

                var rank = document.createElement('span');
                rank.className = 'leaderboard__rank';
                rank.textContent = '#' + (index + 1);

                var name = document.createElement('span');
                name.className = 'leaderboard__alias-name';
                name.textContent = entry.alias;

                var score = document.createElement('span');
                score.className = 'leaderboard__score';
                score.textContent = entry.attempts + (entry.attempts === 1 ? ' intento' : ' intentos');

                li.appendChild(rank);
                li.appendChild(name);
                li.appendChild(score);
                list.appendChild(li);
              });
            });
        }

        // Distance -> emoji square for the share text, closest to
        // farthest: an exact match is always the bullseye, then a
        // blue/green/yellow/orange/red scale by how close the guess was.
        function guessEmoji(guess) {
          if (guess.correct) return '🎯';
          if (guess.dist < 0.5) return '🟦';
          if (guess.dist < 1) return '🟩';
          if (guess.dist < 2.5) return '🟨';
          if (guess.dist < 5) return '🟧';
          return '🟥';
        }

        // Sub-km distances read as meters ("350m"), not a fiddly "0.35km" -
        // km otherwise, one decimal under 10 for a bit of precision without
        // implying false accuracy above it.
        function shareDistanceText(km) {
          if (km < 1) return Math.round(km * 1000) + 'm';
          return (km < 10 ? km.toFixed(1) : Math.round(km)) + 'km';
        }

        // One line per guess, closest to farthest: the square plus how far
        // off it was, or just the bullseye with no distance for the match.
        // How many attempts it took is already implied by the line count,
        // so there's no separate "solved in N/5" summary line.
        function shareLineFor(guess) {
          if (guess.correct) return '🎯';
          return guessEmoji(guess) + ': ' + shareDistanceText(guess.dist);
        }

        function buildShareText() {
          var lines = state.guesses.map(shareLineFor).join('\n');

          return 'Metrordle: Metroguessr #' + state.gameNumber + '\n' +
            lines + '\n\n' +
            SHARE_URL;
        }

        function shareResult() {
          MetroShared.shareOrCopyText(buildShareText(), $('share-btn'));
        }

        // --- search / autocomplete ---
        var input = $('guess-input');
        var suggestionsEl = $('suggestions');
        var guessBtn = $('guess-btn');
        var activeIndex = -1;
        var currentMatches = [];

        function hideSuggestions() {
          suggestionsEl.hidden = true;
          suggestionsEl.innerHTML = '';
          activeIndex = -1;
          currentMatches = [];
        }

        function renderSuggestions(matches) {
          currentMatches = matches;
          activeIndex = -1;
          suggestionsEl.innerHTML = '';
          if (!matches.length) { suggestionsEl.hidden = true; return; }
          matches.slice(0, 8).forEach(function (name) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'suggestion';
            btn.textContent = name;
            btn.addEventListener('mousedown', function (e) {
              e.preventDefault();
              selectStation(name);
            });
            suggestionsEl.appendChild(btn);
          });
          suggestionsEl.hidden = false;
        }

        function selectStation(name) {
          input.value = name;
          hideSuggestions();
          guessBtn.disabled = !stationByName[name];
        }

        input.addEventListener('input', function () {
          guessBtn.disabled = true;
          var q = stripAccents(input.value.trim());
          if (!q) { hideSuggestions(); return; }
          var matches = STATIONS
            .map(function (s) { return s[0]; })
            .filter(function (name) { return stripAccents(name).indexOf(q) !== -1; })
            .sort(function (a, b) {
              var ai = stripAccents(a).indexOf(q), bi = stripAccents(b).indexOf(q);
              if (ai !== bi) return ai - bi;
              return a.length - b.length;
            });
          renderSuggestions(matches);
          if (stationByName[input.value]) guessBtn.disabled = false;
        });

        input.addEventListener('keydown', function (e) {
          if (suggestionsEl.hidden) {
            if (e.key === 'Enter' && !guessBtn.disabled) submitGuess(input.value);
            return;
          }
          var items = suggestionsEl.querySelectorAll('.suggestion');
          if (e.key === 'ArrowDown') {
            e.preventDefault();
            activeIndex = Math.min(activeIndex + 1, items.length - 1);
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            activeIndex = Math.max(activeIndex - 1, 0);
          } else if (e.key === 'Enter') {
            e.preventDefault();
            if (activeIndex >= 0 && currentMatches[activeIndex]) {
              selectStation(currentMatches[activeIndex]);
            } else if (!guessBtn.disabled) {
              submitGuess(input.value);
            }
            return;
          } else if (e.key === 'Escape') {
            hideSuggestions();
            return;
          } else {
            return;
          }
          items.forEach(function (el, i) { el.classList.toggle('suggestion--active', i === activeIndex); });
        });

        document.addEventListener('click', function (e) {
          if (!e.target.closest('.search-box')) hideSuggestions();
        });

        guessBtn.addEventListener('click', function () {
          if (!guessBtn.disabled) submitGuess(input.value);
        });

        $('share-btn').addEventListener('click', shareResult);

        // --- debug date-nav (?debug=true) ---
        function shiftDebugDate(deltaDays) {
          var next = new Date(MetroShared.getEffectiveToday(debugDate).getTime());
          next.setDate(next.getDate() + deltaDays);
          debugDate = next;
          startGame();
        }

        function renderDateDebugLabel() {
          var label = $('date-debug-label');
          if (!label) return;
          var dateKey = MetroShared.getDateKey(MetroShared.getEffectiveToday(debugDate));
          var isRealToday = dateKey === MetroShared.getDateKey(new Date());
          label.textContent = dateKey + (isRealToday ? ' (hoy)' : '');
        }

        if (MetroShared.isDebugMode()) {
          $('date-row').hidden = false;
          $('date-prev').addEventListener('click', function () { shiftDebugDate(-1); });
          $('date-next').addEventListener('click', function () { shiftDebugDate(1); });
        }

        startGame();
      })();
    </script>
  </body>
</html>
