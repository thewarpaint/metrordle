<!DOCTYPE html>
<html
  lang="es-MX"
>
  <head>
    <meta charset="utf-8">
    <!--
      Same policy as /admin/'s own (see its CSP comment for the full
      rationale) - connect-src 'self' already covers this page's own
      /healthcheck.json fetch.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://firestore.googleapis.com https://*.googleapis.com https://www.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self';">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">

    <title>Estado · Metrordle 🚇</title>

    <link rel="icon" href="/favicon.png">

    <link rel="stylesheet" href="/shared.css">

    <!--
      Applies a saved theme override (see /configurar/) before first
      paint - see /admin/'s own identical snippet for why this can't
      just wait for shared.js.
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('metrordle:config');
          var mode = raw && JSON.parse(raw).mode;
          if (mode === 'light' || mode === 'dark') {
            document.documentElement.setAttribute('data-theme', mode);
          }
        } catch (e) {}
      })();
    </script>

    <style>
      .status-boards {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .status-board {
        padding: 1.1rem 1.3rem 1.3rem;
      }

      #recheck-btn {
        margin-top: 0.3rem;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">
        <svg class="brand__mark" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 18 L12 6 L20 18" stroke="var(--ink)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="4" cy="18" r="2.4" fill="var(--ink)"/>
          <circle cx="12" cy="6" r="2.4" fill="var(--ink)"/>
          <circle cx="20" cy="18" r="2.4" fill="var(--ink)"/>
        </svg>
        <span class="brand__text">Metrordle · Estado</span>
        <a class="brand__settings" href="/configurar/" aria-label="Configuración" title="Configuración">⚙️</a>
      </div>

      <div class="status-boards">
        <div class="sign status-board">
          <h2 class="leaderboard__title">Caché</h2>
          <!-- This page is itself precached (see sw.js's own
               PRECACHE_URLS) - caches.keys() reports whichever
               CACHE_NAME is actually populated in this browser right
               now, which is the simplest honest way to show "what
               version is this tab running" without a page/SW message
               round trip. -->
          <p class="leaderboard__status" id="cache-info">Comprobando…</p>
        </div>

        <div class="sign status-board">
          <h2 class="leaderboard__title">Comprobaciones</h2>
          <!-- /healthcheck.json is a static, hardcoded-content file
               that sw.js deliberately never caches (see its own fetch
               handler) - every check here is a real network round
               trip, not a cache hit. -->
          <div class="notice notice--info" id="healthcheck-notice">Comprobando healthcheck.json…</div>
          <!-- A single real Firestore doc read (records/memoria,
               already seeded - see AGENTS.md's "High score records"),
               not shared.js's own getHighScoreRecord(): that helper
               deliberately swallows every failure into a plain `null`
               (see its own comment), which is the opposite of what a
               status page needs - this reads Firestore directly so a
               genuine failure shows up as red, not as an indistinguishable
               "no record yet". -->
          <div class="notice notice--info" id="firebase-notice">Comprobando Firebase…</div>
          <button type="button" class="btn-secondary" id="recheck-btn">Volver a comprobar</button>
        </div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="/firebase-config.js"></script>
    <script src="/shared.js"></script>
    <script>
      (function () {
        'use strict';

        var HEALTHCHECK_TIMEOUT_MS = 8000;
        var FIRESTORE_TIMEOUT_MS = 10000;

        var els = {
          cacheInfo: document.getElementById('cache-info'),
          healthcheck: document.getElementById('healthcheck-notice'),
          firebase: document.getElementById('firebase-notice'),
          recheckBtn: document.getElementById('recheck-btn'),
        };

        function renderCacheInfo() {
          if (!('caches' in window)) {
            els.cacheInfo.textContent = 'Este navegador no soporta Cache Storage.';
            return;
          }
          caches.keys().then(function (keys) {
            els.cacheInfo.textContent = keys.length
              ? 'Caché activa: ' + keys.join(', ')
              : 'Sin caché activa todavía (primera visita, o el service worker sigue instalando).';
          }).catch(function () {
            els.cacheInfo.textContent = 'No se pudo leer Cache Storage.';
          });
        }

        function setChecking(el, label) {
          el.className = 'notice notice--info';
          el.textContent = 'Comprobando ' + label + '…';
        }

        function setResult(el, ok, text) {
          el.className = 'notice ' + (ok ? 'notice--success' : 'notice--error');
          el.textContent = (ok ? '✅ ' : '❌ ') + text;
        }

        function checkHealthcheck() {
          setChecking(els.healthcheck, 'healthcheck.json');
          var start = performance.now();
          var controller = ('AbortController' in window) ? new AbortController() : null;
          var timer = controller && setTimeout(function () { controller.abort(); }, HEALTHCHECK_TIMEOUT_MS);
          // Cache-busting query string, plus cache: 'no-store' for the
          // browser's own HTTP cache - sw.js's fetch handler already
          // skips this path entirely (see its own comment), this is
          // belt-and-suspenders against any other layer of caching.
          var url = '/healthcheck.json?t=' + Date.now();

          fetch(url, { cache: 'no-store', signal: controller ? controller.signal : undefined })
            .then(function (res) {
              if (timer) clearTimeout(timer);
              if (!res.ok) throw new Error('HTTP ' + res.status);
              return res.json();
            })
            .then(function (data) {
              var ms = Math.round(performance.now() - start);
              if (data && data.status === 'ok') {
                setResult(els.healthcheck, true, 'healthcheck.json respondió "ok" en ' + ms + ' ms');
              } else {
                setResult(els.healthcheck, false, 'healthcheck.json respondió con contenido inesperado (' + ms + ' ms)');
              }
            })
            .catch(function (err) {
              if (timer) clearTimeout(timer);
              var ms = Math.round(performance.now() - start);
              var reason = (err && err.name === 'AbortError') ? 'tiempo agotado' : ((err && err.message) || 'error desconocido');
              setResult(els.healthcheck, false, 'healthcheck.json falló (' + reason + ', ' + ms + ' ms)');
            });
        }

        function checkFirebase() {
          setChecking(els.firebase, 'Firebase');
          var start = performance.now();

          if (typeof firebase === 'undefined' || !firebase.apps || !firebase.apps.length) {
            var readyMs = Math.round(performance.now() - start);
            setResult(els.firebase, false, 'Firebase no inicializó (SDK no disponible, ' + readyMs + ' ms)');
            return;
          }

          var query = firebase.firestore().collection('records').doc('memoria').get();
          // Promise.race doesn't cancel the underlying Firestore
          // request, only stops waiting on it - fine here, this is a
          // one-off diagnostic read, not something that needs to be
          // aborted on the wire.
          var timeout = new Promise(function (resolve, reject) {
            setTimeout(function () { reject(new Error('timeout')); }, FIRESTORE_TIMEOUT_MS);
          });

          Promise.race([query, timeout])
            .then(function () {
              var ms = Math.round(performance.now() - start);
              setResult(els.firebase, true, 'Firebase (Firestore) respondió en ' + ms + ' ms');
            })
            .catch(function (err) {
              var ms = Math.round(performance.now() - start);
              var reason = (err && err.message === 'timeout') ? 'tiempo agotado' : ((err && err.message) || 'error desconocido');
              setResult(els.firebase, false, 'Firebase (Firestore) falló (' + reason + ', ' + ms + ' ms)');
            });
        }

        function runChecks() {
          renderCacheInfo();
          checkHealthcheck();
          checkFirebase();
        }

        els.recheckBtn.addEventListener('click', runChecks);
        runChecks();
      })();
    </script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </body>
</html>
